# Protected video playback via secure_link.
#
# Player URLs look like:
#   https://videos.tiquiz.com/<app>/raw/<userId>/<videoId>/source.mp4?md5=<hash>&expires=<unix>
#
# secure_link_md5 verifies $secure_link_expires + URI + secret. If the
# hash doesn't match or the timestamp is past, nginx returns 403/410.
# The Next backend mints these URLs in lib/popquiz/repo.ts using the
# same secret + expiry, so links rotate every couple of hours.
#
# We use the query-string variant rather than path-based because
# Range requests carry query strings cleanly across browsers and CDNs,
# and nginx parses them without a regex location.

server {
    listen 80;
    listen [::]:80;
    server_name videos.tiquiz.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name videos.tiquiz.com;

    ssl_certificate     /etc/letsencrypt/live/videos.tiquiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/videos.tiquiz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CORS so the <video> element can stream cross-origin from the
    # app domain. We're not gating on Origin: the secret + expiry
    # do the gating.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    sendfile on;
    tcp_nopush on;
    aio threads;
    directio 4m;
    output_buffers 2 1m;

    root /srv/popquiz-videos;

    # Block dotfiles, tus configstore JSONs, and anything outside the
    # raw/ scope. Done before the main location so it always wins.
    location ~ /\. { deny all; }
    location ~* \.json$ { deny all; }

    # ── LES IMAGES DES QUIZ, sur ce meme domaine ─────────────────────
    #
    # Elles n'ont RIEN a voir avec les videos : pas de secure_link, pas
    # d'expiration. Ces images sont deja PUBLIQUES (elles s'affichent
    # sur des pages de quiz ouvertes a tous, et dans les apercus de
    # partage), et une URL qui expire casserait l'apercu Facebook d'un
    # partage trois jours plus tard.
    #
    # Elles vivent ICI plutot que sur un sous-domaine a elles parce que
    # celui ci a DEJA son DNS et son certificat. Un sous-domaine de
    # plus, c'est un enregistrement DNS de plus, un certificat de plus,
    # et un renouvellement de plus a surveiller, pour zero gain.
    #
    # `^~` n'est pas cosmetique : sans lui le `location /` ci dessous
    # gagnerait, appliquerait secure_link a des images publiques, et
    # renverrait 403 sur toutes.
    #
    # Ce qui est ecrit dans ce dossier passe par une LISTE BLANCHE
    # d'extensions (lib/storage/cheminAsset.ts) : ni svg ni html ni php
    # ne peuvent y arriver. `nosniff` + `application/octet-stream` sont
    # la ceinture par dessus les bretelles.
    location ^~ /assets/ {
        alias /srv/assets-tiquiz/;

        # Le nom du fichier porte l'horodatage de l'envoi : une adresse
        # ne designe jamais deux contenus differents, donc un an de
        # cache ne sert jamais une version perimee.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Le studio visuel relit ces images dans un <canvas> : sans cet
        # en-tete, le canvas devient "tainted" et l'export echoue.
        add_header Access-Control-Allow-Origin "*" always;

        # Ce qu'on ne reconnait pas se telecharge au lieu de s'afficher.
        default_type application/octet-stream;

        try_files $uri =404;
    }

    location / {
        # md5 hash: base64url( md5_raw( "<expires><uri> <secret>" ) )
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri SECURE_LINK_SECRET_PLACEHOLDER";

        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }

        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri =404;
    }
}
