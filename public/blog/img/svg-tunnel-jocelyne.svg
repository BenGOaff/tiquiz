<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" preserveAspectRatio="xMidYMid meet" style="font-family:'Open Sans',-apple-system,system-ui,sans-serif;" role="img" aria-labelledby="ttj-t ttj-d">
  <title id="ttj-t">Le tunnel : Audience, Pub Meta, Quiz Tiquiz, Email auto, Livre Amazon</title>
  <desc id="ttj-d">Schéma simple en 5 étapes du dispositif de Jocelyne.</desc>

  <g transform="translate(20, 30)">
    <rect width="160" height="200" rx="14" fill="#F8F9FC"/>
    <g transform="translate(80, 60)" stroke="#5A6EF6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-10" cy="-8" r="9"/>
      <path d="M-25 18 Q-25 6 -10 6 Q5 6 5 18"/>
      <circle cx="13" cy="-5" r="7"/>
      <path d="M-2 16 Q-2 6 13 6 Q26 6 26 16"/>
    </g>
    <text x="80" y="125" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">Audience ciblée</text>
    <text x="80" y="148" text-anchor="middle" font-size="11" fill="#6B7280">Femmes 30-55 ans</text>
    <text x="80" y="166" text-anchor="middle" font-size="11" fill="#6B7280">Intérêts dév. perso</text>
  </g>

  <g transform="translate(185, 130)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#5A6EF6" stroke-width="2" stroke-linecap="round"/>
    <polygon points="20,-5 30,0 20,5" fill="#5A6EF6"/>
  </g>

  <g transform="translate(220, 30)">
    <rect width="160" height="200" rx="14" fill="#F8F9FC"/>
    <g transform="translate(60, 44)" stroke="#5A6EF6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="40" height="32" rx="4"/>
      <line x1="0" y1="10" x2="40" y2="10"/>
      <circle cx="6" cy="5" r="1.5" fill="#5A6EF6"/>
      <circle cx="11" cy="5" r="1.5" fill="#5A6EF6"/>
    </g>
    <text x="80" y="125" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">Pub Meta</text>
    <text x="80" y="148" text-anchor="middle" font-size="11" fill="#6B7280">Facebook · Instagram</text>
    <text x="80" y="166" text-anchor="middle" font-size="11" fill="#6B7280">7 €/jour</text>
  </g>

  <g transform="translate(385, 130)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#5A6EF6" stroke-width="2" stroke-linecap="round"/>
    <polygon points="20,-5 30,0 20,5" fill="#5A6EF6"/>
  </g>

  <g transform="translate(420, 30)">
    <rect width="160" height="200" rx="14" fill="#EEF0FE" stroke="#20BBE6" stroke-width="2"/>
    <g transform="translate(80, 60)">
      <circle cx="0" cy="0" r="20" stroke="#20BBE6" stroke-width="2.5" fill="none"/>
      <text x="0" y="8" text-anchor="middle" font-size="24" font-weight="900" fill="#20BBE6">?</text>
    </g>
    <text x="80" y="125" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">Quiz Tiquiz</text>
    <text x="80" y="148" text-anchor="middle" font-size="11" fill="#6B7280">5 questions</text>
    <text x="80" y="166" text-anchor="middle" font-size="11" fill="#6B7280">5 profils sur mesure</text>
  </g>

  <g transform="translate(585, 130)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#5A6EF6" stroke-width="2" stroke-linecap="round"/>
    <polygon points="20,-5 30,0 20,5" fill="#5A6EF6"/>
  </g>

  <g transform="translate(620, 30)">
    <rect width="160" height="200" rx="14" fill="#F8F9FC"/>
    <g transform="translate(58, 46)" stroke="#5A6EF6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="44" height="32" rx="4"/>
      <path d="M0 4 L22 20 L44 4"/>
    </g>
    <text x="80" y="125" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">Email automatique</text>
    <text x="80" y="148" text-anchor="middle" font-size="11" fill="#6B7280">Adapté au profil</text>
    <text x="80" y="166" text-anchor="middle" font-size="11" fill="#6B7280">via Systeme.io</text>
  </g>

  <g transform="translate(785, 130)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#5A6EF6" stroke-width="2" stroke-linecap="round"/>
    <polygon points="20,-5 30,0 20,5" fill="#5A6EF6"/>
  </g>

  <g transform="translate(820, 30)">
    <rect width="160" height="200" rx="14" fill="#F8F9FC"/>
    <g transform="translate(62, 42)" stroke="#5A6EF6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="36" height="44" rx="2"/>
      <line x1="5" y1="10" x2="31" y2="10"/>
      <line x1="5" y1="18" x2="31" y2="18"/>
      <line x1="5" y1="26" x2="24" y2="26"/>
    </g>
    <text x="80" y="125" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">Livre Amazon</text>
    <text x="80" y="148" text-anchor="middle" font-size="11" fill="#6B7280">CTA dans l'email</text>
    <text x="80" y="166" text-anchor="middle" font-size="11" fill="#6B7280">de résultat</text>
  </g>
