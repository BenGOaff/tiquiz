<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" style="font-family: Inter, 'Segoe UI', Arial, sans-serif;" role="img" aria-labelledby="lect-en-t lect-en-d">
  <title id="lect-en-t">How to read the numbers: 2 readings depending on your profile</title>
  <desc id="lect-en-d">Card for Meta ads pros and card for beginners, with key ratios and what they mean.</desc>
  <defs>
    <linearGradient id="bgProGen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4FE"/>
    </linearGradient>
    <linearGradient id="bgBegGen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF7FC"/>
    </linearGradient>
    <filter id="lectShadowEn" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2E386E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- CARD 1 — PRO -->
  <g transform="translate(20, 20)">
    <rect width="560" height="380" rx="16" fill="url(#bgProGen)" stroke="#5A6EF6" stroke-width="2" filter="url(#lectShadowEn)"/>
    <rect x="32" y="32" width="240" height="32" rx="16" fill="#5A6EF6"/>
    <text x="152" y="53" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">IF YOU'RE A META ADS PRO</text>
    <text x="32" y="110" font-size="22" font-weight="800" fill="#2E386E">Key ratios to remember</text>

    <text xml:space="preserve" x="32" y="158" font-size="16" fill="#2E386E"><tspan font-weight="700" fill="#5A6EF6">CTR ≈ 2.8%</tspan> (683/24,417): above the</text>
    <text x="32" y="186" font-size="16" fill="#2E386E">French-speaking B2C average per Interact 2026.</text>

    <text xml:space="preserve" x="32" y="226" font-size="16" fill="#2E386E"><tspan font-weight="700" fill="#5A6EF6">Click-to-lead ≈ 41.7%</tspan> (285/683): top of</text>
    <text x="32" y="254" font-size="16" fill="#2E386E">public benchmarks for a quiz funnel.</text>

    <text xml:space="preserve" x="32" y="294" font-size="16" fill="#2E386E"><tspan font-weight="700" fill="#5A6EF6">CPL €0.18</tspan>: gap documented by Dashform</text>
    <text x="32" y="322" font-size="16" fill="#2E386E">2026 (2.4× to 10× vs PDF).</text>
  </g>

  <!-- CARD 2 — BEGINNER -->
  <g transform="translate(620, 20)">
    <rect width="560" height="380" rx="16" fill="url(#bgBegGen)" stroke="#20BBE6" stroke-width="2" filter="url(#lectShadowEn)"/>
    <rect x="32" y="32" width="240" height="32" rx="16" fill="#20BBE6"/>
    <text x="152" y="53" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">IF YOU'RE NEW TO META ADS</text>
    <text x="32" y="110" font-size="22" font-weight="800" fill="#2E386E">What this means in plain terms</text>

    <text xml:space="preserve" x="32" y="158" font-size="16" fill="#2E386E"><tspan font-weight="700" fill="#0EA2CB">€0.18 per lead</tspan> means that's the cost</text>
    <text x="32" y="186" font-size="16" fill="#2E386E">paid for an interested person to leave</text>
    <text x="32" y="214" font-size="16" fill="#2E386E">their email to Jocelyne via the quiz.</text>

    <text xml:space="preserve" x="32" y="254" font-size="16" fill="#2E386E">With <tspan font-weight="700" fill="#0EA2CB">€63.50</tspan> of ad budget over 9 days,</text>
    <text xml:space="preserve" x="32" y="282" font-size="16" fill="#2E386E">Jocelyne got <tspan font-weight="700" fill="#0EA2CB">285 qualified readers</tspan>.</text>

    <text x="32" y="322" font-size="16" fill="#2E386E">Without an existing audience, a starting</text>
    <text x="32" y="350" font-size="16" fill="#2E386E">point that would have taken months organically.</text>
  </g>
</svg>
