<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid meet" style="font-family: Arial, 'Helvetica Neue', sans-serif;" xml:space="preserve">
  <rect x="0" y="0" width="1400" height="700" fill="#FFFFFF"/>

  <defs>
    <symbol id="chev" viewBox="0 0 10 6">
      <polygon points="0,0 10,0 5,6" fill="#007185"/>
    </symbol>
  </defs>

  <!-- Title -->
  <text x="20" y="40" font-size="24" font-weight="700" fill="#0F1111">Product details</text>

  <!-- ASIN -->
  <text x="20" y="92" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">ASIN </tspan><tspan font-weight="700">:</tspan> B0H1GP7CJP</text>

  <!-- Accessibility -->
  <text x="20" y="132" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">Accessibility </tspan><tspan font-weight="700">:</tspan> <tspan fill="#007185">Learn more</tspan></text>

  <!-- Publication date -->
  <text x="20" y="172" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">Publication date </tspan><tspan font-weight="700">:</tspan> June 9, 2026</text>

  <!-- Language -->
  <text x="20" y="212" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">Language </tspan><tspan font-weight="700">:</tspan> French</text>

  <!-- File size -->
  <text x="20" y="252" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">File size </tspan><tspan font-weight="700">:</tspan> 4.3 MB</text>

  <!-- Enhanced typesetting -->
  <text x="20" y="292" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">Enhanced typesetting </tspan><tspan font-weight="700">:</tspan> <tspan fill="#007185">Enabled</tspan></text>
  <use href="#chev" x="277" y="285" width="10" height="6"/>

  <!-- Word Wise -->
  <text x="20" y="332" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">Word Wise </tspan><tspan font-weight="700">:</tspan> <tspan fill="#007185">Not Enabled</tspan></text>
  <use href="#chev" x="223" y="325" width="10" height="6"/>

  <!-- Print length -->
  <text x="20" y="372" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">Print length </tspan><tspan font-weight="700">:</tspan> <tspan fill="#007185">112 pages</tspan></text>
  <use href="#chev" x="216" y="365" width="10" height="6"/>

  <!-- Page Flip -->
  <text x="20" y="412" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">Page Flip </tspan><tspan font-weight="700">:</tspan> <tspan fill="#007185">Enabled</tspan></text>
  <use href="#chev" x="173" y="405" width="10" height="6"/>

  <!-- Best Sellers Rank -->
  <text x="20" y="462" font-size="17" fill="#0F1111" xml:space="preserve"><tspan font-weight="700">Best Sellers Rank</tspan><tspan font-weight="700">:</tspan> #12,599 in Kindle Store (<tspan fill="#007185">See Top 100 in Kindle Store</tspan>)</text>

  <!-- Yellow highlighted box around 3 categories -->
  <rect x="20" y="480" width="700" height="140" fill="#FFF1A8" rx="2"/>

  <text x="40" y="513" font-size="17" fill="#0F1111" xml:space="preserve">#2 in <tspan fill="#007185">Anger Management eBooks</tspan></text>
  <text x="40" y="553" font-size="17" fill="#0F1111" xml:space="preserve">#7 in <tspan fill="#007185">Practical Health &amp; Wellness Guides</tspan></text>
  <text x="40" y="593" font-size="17" fill="#0F1111" xml:space="preserve">#15 in <tspan fill="#007185">Self-Help eBooks on Emotions</tspan></text>
</svg>
