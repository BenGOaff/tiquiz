<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 780" preserveAspectRatio="xMidYMid meet" style="font-family: 'Open Sans', sans-serif;" role="img" aria-labelledby="ttj-en-m-t ttj-en-m-d">
  <title id="ttj-en-m-t">Funnel (mobile): Audience, Meta ads, Tiquiz quiz, automated email, Amazon book</title>
  <desc id="ttj-en-m-d">Vertical 5-step diagram for mobile.</desc>

  <g transform="translate(20, 20)">
