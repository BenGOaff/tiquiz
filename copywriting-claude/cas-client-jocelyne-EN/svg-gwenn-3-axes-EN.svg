<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" style="font-family: Inter, 'Segoe UI', Arial, sans-serif;" role="img" aria-labelledby="gwenn-en-t gwenn-en-d">
  <title id="gwenn-en-t">What Gwenn brought on 3 fronts: technical, strategic, human</title>
  <desc id="gwenn-en-d">Three cards with icon, title, and description for Gwenn's contributions to Jocelyne's campaign.</desc>
  <defs>
    <linearGradient id="gwennEnIconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <filter id="cardShadowEn" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2E386E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- TECHNICAL -->
  <g transform="translate(30, 20)">
    <rect width="360" height="380" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadowEn)"/>
    <rect x="28" y="28" width="60" height="60" rx="14" fill="url(#gwennEnIconG)"/>
    <g transform="translate(58, 58)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="10"/>
      <circle r="3.5" fill="#FFFFFF"/>
      <line x1="0" y1="-15" x2="0" y2="-12"/>
      <line x1="0" y1="12" x2="0" y2="15"/>
      <line x1="-15" y1="0" x2="-12" y2="0"/>
      <line x1="12" y1="0" x2="15" y2="0"/>
      <line x1="-11" y1="-11" x2="-8" y2="-8"/>
      <line x1="8" y1="-8" x2="11" y2="-11"/>
      <line x1="-11" y1="11" x2="-8" y2="8"/>
      <line x1="8" y1="8" x2="11" y2="11"/>
    </g>
    <text x="28" y="148" font-size="20" font-weight="800" fill="#2E386E">Technical</text>
    <text font-size="16" fill="#2E386E">
      <tspan x="28" y="188">Meta pixel installed on the quiz,</tspan>
      <tspan x="28" y="216">targeting, continuous optimization,</tspan>
      <tspan x="28" y="244">Tiquiz↔Systeme.io connection.</tspan>
      <tspan x="28" y="272" font-style="italic" fill="#5A6EF6">"A real tech mess,"</tspan>
      <tspan x="28" y="300">Jocelyne admits.</tspan>
      <tspan x="28" y="328">Gwenn cleared the whole path.</tspan>
    </text>
  </g>

  <!-- STRATEGIC -->
  <g transform="translate(420, 20)">
    <rect width="360" height="380" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadowEn)"/>
    <rect x="28" y="28" width="60" height="60" rx="14" fill="url(#gwennEnIconG)"/>
    <g transform="translate(58, 58)" stroke="#FFFFFF" stroke-width="2.2" fill="none">
      <circle r="13"/>
      <circle r="8"/>
      <circle r="3" fill="#FFFFFF"/>
    </g>
    <text x="28" y="148" font-size="20" font-weight="800" fill="#2E386E">Strategic</text>
    <text font-size="16" fill="#2E386E">
      <tspan x="28" y="188">Lead magnet selection,</tspan>
      <tspan x="28" y="216">funnel design, ad hook wording,</tspan>
      <tspan x="28" y="244">creative angle.</tspan>
      <tspan x="28" y="272">The quiz could have stayed</tspan>
      <tspan x="28" y="300">invisible.</tspan>
      <tspan x="28" y="328">Gwenn put it into orbit.</tspan>
    </text>
  </g>

  <!-- HUMAN -->
  <g transform="translate(810, 20)">
    <rect width="360" height="380" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadowEn)"/>
    <rect x="28" y="28" width="60" height="60" rx="14" fill="url(#gwennEnIconG)"/>
    <g transform="translate(58, 58)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round">
      <path d="M0 12 C-11 4 -14 -4 -8 -9 C-4 -11 -1 -8 0 -5 C1 -8 4 -11 8 -9 C14 -4 11 4 0 12 Z"/>
    </g>
    <text x="28" y="148" font-size="20" font-weight="800" fill="#2E386E">Human</text>
    <text font-size="16" fill="#2E386E">
      <tspan x="28" y="188">Constant presence, useful and</tspan>
      <tspan x="28" y="216">clear explainer videos, the ability</tspan>
      <tspan x="28" y="244">to</tspan>
      <tspan x="28" y="272" font-style="italic" fill="#5A6EF6">"read between the lines"</tspan>
      <tspan x="28" y="300">and pump the brakes when</tspan>
      <tspan x="28" y="328">needed.</tspan>
    </text>
  </g>
</svg>
