  <!-- Ad copy -->
  <text x="70" y="350" font-size="16" fill="#1C1E21" xml:space="preserve">Have you ever read articles about ADHD and thought "this doesn't really</text>
  <text x="40" y="375" font-size="16" fill="#1C1E21">sound like me"? That's normal — adult ADHD has many faces! And you simply</text>
  <text x="40" y="400" font-size="16" fill="#1C1E21">haven't met yours yet.</text>

  <text x="40" y="445" font-size="16" fill="#1C1E21">15 questions. Very concrete everyday situations. No right or wrong answer — just</text>
  <text x="40" y="470" font-size="16" fill="#1C1E21" xml:space="preserve">yours.…</text>

