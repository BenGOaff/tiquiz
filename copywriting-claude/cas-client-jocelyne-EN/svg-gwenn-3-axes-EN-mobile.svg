<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" preserveAspectRatio="xMidYMid meet" style="font-family: Inter, 'Segoe UI', Arial, sans-serif;" role="img" aria-labelledby="gwenn-en-m-t gwenn-en-m-d">
  <title id="gwenn-en-m-t">Gwenn's contribution: technical, strategic, human (mobile)</title>
  <desc id="gwenn-en-m-d">Three cards stacked vertically with icon, title, and description.</desc>
  <defs>
    <linearGradient id="gwennEnIconGm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <filter id="cardShadowEnM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2E386E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- TECHNICAL -->
  <g transform="translate(20, 20)">
    <rect width="360" height="230" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadowEnM)"/>
    <rect x="24" y="24" width="54" height="54" rx="13" fill="url(#gwennEnIconGm)"/>
    <g transform="translate(51, 51)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="10"/>
      <circle r="3.5" fill="#FFFFFF"/>
      <line x1="0" y1="-15" x2="0" y2="-12"/>
      <line x1="0" y1="12" x2="0" y2="15"/>
      <line x1="-15" y1="0" x2="-12" y2="0"/>
      <line x1="12" y1="0" x2="15" y2="0"/>
      <line x1="-11" y1="-11" x2="-8" y2="-8"/>
      <line x1="8" y1="-8" x2="11" y2="-11"/>
      <line x1="-11" y1="11" x2="-8" y2="8"/>
      <line x1="8" y1="8" x2="11" y2="11"/>
    </g>
    <text x="92" y="58" font-size="20" font-weight="800" fill="#2E386E">Technical</text>
    <text font-size="15" fill="#2E386E">
      <tspan x="24" y="110">Meta pixel installed, targeting,</tspan>
      <tspan x="24" y="134">continuous optimization, Tiquiz↔</tspan>
      <tspan x="24" y="158">Systeme.io connection.</tspan>
      <tspan x="24" y="186" font-style="italic" fill="#5A6EF6">"A real tech mess,"</tspan> Jocelyne admits.
      <tspan x="24" y="210">Gwenn cleared the whole path.</tspan>
    </text>
  </g>

  <!-- STRATEGIC -->
  <g transform="translate(20, 270)">
    <rect width="360" height="220" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadowEnM)"/>
    <rect x="24" y="24" width="54" height="54" rx="13" fill="url(#gwennEnIconGm)"/>
    <g transform="translate(51, 51)" stroke="#FFFFFF" stroke-width="2.2" fill="none">
      <circle r="13"/>
      <circle r="8"/>
      <circle r="3" fill="#FFFFFF"/>
    </g>
    <text x="92" y="58" font-size="20" font-weight="800" fill="#2E386E">Strategic</text>
    <text font-size="15" fill="#2E386E">
      <tspan x="24" y="110">Lead magnet selection, funnel</tspan>
      <tspan x="24" y="134">design, ad hook wording,</tspan>
      <tspan x="24" y="158">creative angle.</tspan>
      <tspan x="24" y="186">The quiz could have stayed invisible.</tspan>
      <tspan x="24" y="210">Gwenn put it into orbit.</tspan>
    </text>
  </g>

  <!-- HUMAN -->
  <g transform="translate(20, 510)">
    <rect width="360" height="230" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadowEnM)"/>
    <rect x="24" y="24" width="54" height="54" rx="13" fill="url(#gwennEnIconGm)"/>
    <g transform="translate(51, 51)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round">
      <path d="M0 12 C-11 4 -14 -4 -8 -9 C-4 -11 -1 -8 0 -5 C1 -8 4 -11 8 -9 C14 -4 11 4 0 12 Z"/>
    </g>
    <text x="92" y="58" font-size="20" font-weight="800" fill="#2E386E">Human</text>
    <text font-size="15" fill="#2E386E">
      <tspan x="24" y="110">Constant presence, useful and</tspan>
      <tspan x="24" y="134">clear explainer videos,</tspan>
      <tspan x="24" y="158">the ability to</tspan>
      <tspan x="24" y="186" font-style="italic" fill="#5A6EF6">"read between the lines"</tspan>
      <tspan x="24" y="210">and pump the brakes when needed.</tspan>
    </text>
  </g>
</svg>
