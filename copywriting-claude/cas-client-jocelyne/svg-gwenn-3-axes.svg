<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" style="font-family: Inter, 'Segoe UI', Arial, sans-serif;" role="img" aria-labelledby="gwenn-title gwenn-desc">
  <title id="gwenn-title">Ce que Gwenn a apporté sur 3 plans : technique, stratégique, humain</title>
  <desc id="gwenn-desc">Trois cartes avec icône, titre et description pour les apports de Gwenn dans la campagne de Jocelyne.</desc>
  <defs>
    <linearGradient id="gwennIconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2E386E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ============ TECHNIQUE ============ -->
  <g transform="translate(30, 20)">
    <!-- Card background -->
    <rect width="360" height="380" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadow)"/>

    <!-- Icon -->
    <rect x="28" y="28" width="60" height="60" rx="14" fill="url(#gwennIconG)"/>
    <g transform="translate(58, 58)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="10"/>
      <circle r="3.5" fill="#FFFFFF"/>
      <line x1="0" y1="-15" x2="0" y2="-12"/>
      <line x1="0" y1="12" x2="0" y2="15"/>
      <line x1="-15" y1="0" x2="-12" y2="0"/>
      <line x1="12" y1="0" x2="15" y2="0"/>
      <line x1="-11" y1="-11" x2="-8" y2="-8"/>
      <line x1="8" y1="-8" x2="11" y2="-11"/>
      <line x1="-11" y1="11" x2="-8" y2="8"/>
      <line x1="8" y1="8" x2="11" y2="11"/>
    </g>

    <!-- Title -->
    <text x="28" y="148" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#2E386E">Technique</text>

    <!-- Body -->
    <text font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="16" fill="#2E386E">
      <tspan x="28" y="188">Pixel Meta installé sur le quiz,</tspan>
      <tspan x="28" y="216">ciblage, optimisation continue,</tspan>
      <tspan x="28" y="244">raccord Tiquiz↔Systeme.io.</tspan>
      <tspan x="28" y="272" font-style="italic" fill="#5A6EF6">« Un sacré bazar sur le plan</tspan>
      <tspan x="28" y="300" font-style="italic" fill="#5A6EF6">technique »,</tspan>
      <tspan x="28" y="328">reconnaît Jocelyne. Gwenn a</tspan>
      <tspan x="28" y="356">tout débroussaillé.</tspan>
    </text>
  </g>

  <!-- ============ STRATÉGIQUE ============ -->
  <g transform="translate(420, 20)">
    <rect width="360" height="380" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadow)"/>

    <rect x="28" y="28" width="60" height="60" rx="14" fill="url(#gwennIconG)"/>
    <g transform="translate(58, 58)" stroke="#FFFFFF" stroke-width="2.2" fill="none">
      <circle r="13"/>
      <circle r="8"/>
      <circle r="3" fill="#FFFFFF"/>
    </g>

    <text x="28" y="148" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#2E386E">Stratégique</text>

    <text font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="16" fill="#2E386E">
      <tspan x="28" y="188">Choix du lead magnet, look du</tspan>
      <tspan x="28" y="216">tunnel, formulation du hook</tspan>
      <tspan x="28" y="244">publicitaire, angle créatif. Le quiz</tspan>
      <tspan x="28" y="272">aurait pu rester invisible.</tspan>
      <tspan x="28" y="300">Gwenn l'a mis en orbite.</tspan>
    </text>
  </g>

  <!-- ============ HUMAIN ============ -->
  <g transform="translate(810, 20)">
    <rect width="360" height="380" rx="16" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="2" filter="url(#cardShadow)"/>

    <rect x="28" y="28" width="60" height="60" rx="14" fill="url(#gwennIconG)"/>
    <g transform="translate(58, 58)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round">
      <path d="M0 12 C-11 4 -14 -4 -8 -9 C-4 -11 -1 -8 0 -5 C1 -8 4 -11 8 -9 C14 -4 11 4 0 12 Z"/>
    </g>

    <text x="28" y="148" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#2E386E">Humain</text>

    <text font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="16" fill="#2E386E">
      <tspan x="28" y="188">Présence constante, vidéos</tspan>
      <tspan x="28" y="216">explicatives utiles et claires,</tspan>
      <tspan x="28" y="244">capacité à</tspan>
      <tspan x="28" y="272" font-style="italic" fill="#5A6EF6">« comprendre entre les lignes »</tspan>
      <tspan x="28" y="300">et à calmer les ardeurs.</tspan>
    </text>
  </g>
</svg>
