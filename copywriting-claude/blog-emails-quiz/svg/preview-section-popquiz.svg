<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" preserveAspectRatio="xMidYMid meet" style="font-family:'Open Sans','Inter',sans-serif;" role="img" aria-labelledby="ttl">
  <title id="ttl">Aperçu — Section Popquiz pour page de vente Tiquiz</title>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FE"/>
      <stop offset="100%" stop-color="#EBF5FF"/>
    </linearGradient>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B3264"/>
      <stop offset="100%" stop-color="#1A1F4D"/>
    </linearGradient>
    <linearGradient id="quizBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F7FE"/>
    </linearGradient>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#4F5FE3"/>
    </linearGradient>
    <linearGradient id="chipCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5DD5F0"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#5A6EF6" flood-opacity="0.18"/>
    </filter>
    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#5A6EF6" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1280" height="1100" fill="url(#bg)"/>

  <!-- Particules -->
  <circle cx="90" cy="120" r="7" fill="#5A6EF6" opacity="0.4"/>
  <circle cx="160" cy="180" r="4" fill="#20BBE6" opacity="0.7"/>
  <circle cx="120" cy="220" r="5" fill="#5A6EF6" opacity="0.5"/>
  <circle cx="1200" cy="800" r="5" fill="#5A6EF6" opacity="0.5"/>
  <circle cx="1160" cy="860" r="3" fill="#20BBE6" opacity="0.7"/>
  <circle cx="1220" cy="400" r="4" fill="#5A6EF6" opacity="0.35"/>

  <!-- ========== CONTENU GAUCHE (text) ========== -->
  <g transform="translate(80, 120)">
    <!-- Chip "NOUVEAU · POPQUIZ" -->
    <g>
      <rect width="180" height="32" rx="14" fill="url(#chipCyan)"/>
      <text x="90" y="22" text-anchor="middle" fill="#fff" font-weight="800" font-size="13" letter-spacing="0.1em">NOUVEAU · POPQUIZ</text>
    </g>

    <!-- Title H2 -->
    <text x="0" y="90" fill="#2B3264" font-weight="700" font-size="44" letter-spacing="-0.02em">Importe une vidéo,</text>
    <text x="0" y="138" fill="#2B3264" font-weight="700" font-size="44" letter-spacing="-0.02em">ajoute tes quiz dedans,</text>
    <text x="0" y="186" fill="#2B3264" font-weight="700" font-size="44" letter-spacing="-0.02em">elle devient une</text>
    <text x="0" y="234" fill="#5A6EF6" font-weight="700" font-size="44" letter-spacing="-0.02em">machine à leads</text>

    <!-- Sub -->
    <text x="0" y="278" fill="#5C6485" font-size="17">Tu prends une vidéo (lien YouTube, lien Vimeo ou fichier perso),</text>
    <text x="0" y="302" fill="#5C6485" font-size="17">tu la déposes dans Popquiz, tu places tes quiz aux moments-clés</text>
    <text x="0" y="326" fill="#5C6485" font-size="17">et tu publies. Le spectateur répond, son email atterrit taggué dans</text>
    <text x="0" y="350" fill="#5C6485" font-size="17">Systeme io.</text>

    <!-- Bullets list -->
    <g transform="translate(0, 380)">
      <g transform="translate(0, 0)">
        <circle cx="13" cy="13" r="13" fill="#20BBE6"/>
        <text x="13" y="18" text-anchor="middle" fill="#fff" font-weight="900" font-size="13">✓</text>
        <text x="38" y="18" fill="#2B3264" font-size="15.5" font-weight="500">Importe ta vidéo : lien YouTube, Vimeo ou fichier perso jusqu'à 2 Go</text>
      </g>
      <g transform="translate(0, 38)">
        <circle cx="13" cy="13" r="13" fill="#20BBE6"/>
        <text x="13" y="18" text-anchor="middle" fill="#fff" font-weight="900" font-size="13">✓</text>
        <text x="38" y="18" fill="#2B3264" font-size="15.5" font-weight="500">Place tes quiz aux moments-clés sur la timeline</text>
      </g>
      <g transform="translate(0, 76)">
        <circle cx="13" cy="13" r="13" fill="#20BBE6"/>
        <text x="13" y="18" text-anchor="middle" fill="#fff" font-weight="900" font-size="13">✓</text>
        <text x="38" y="18" fill="#2B3264" font-size="15.5" font-weight="500">Mode bloquant ou optionnel par moment-quiz</text>
      </g>
      <g transform="translate(0, 114)">
        <circle cx="13" cy="13" r="13" fill="#20BBE6"/>
        <text x="13" y="18" text-anchor="middle" fill="#fff" font-weight="900" font-size="13">✓</text>
        <text x="38" y="18" fill="#2B3264" font-size="15.5" font-weight="500">Leads taggués automatiquement dans Systeme io, sans Zapier</text>
      </g>
      <g transform="translate(0, 152)">
        <circle cx="13" cy="13" r="13" fill="#20BBE6"/>
        <text x="13" y="18" text-anchor="middle" fill="#fff" font-weight="900" font-size="13">✓</text>
        <text x="38" y="18" fill="#2B3264" font-size="15.5" font-weight="500">Embed sur ton blog, page Systeme io ou site WordPress</text>
      </g>
    </g>

    <!-- CTA -->
    <g transform="translate(0, 580)" filter="url(#cardShadow)">
      <rect width="220" height="58" rx="29" fill="url(#ctaBg)"/>
      <text x="40" y="36" fill="#fff" font-weight="700" font-size="17">C'est parti !</text>
      <circle cx="180" cy="29" r="14" fill="rgba(255,255,255,0.2)"/>
      <text x="180" y="34" text-anchor="middle" fill="#fff" font-weight="900" font-size="16">→</text>
    </g>
  </g>

  <!-- ========== MOCKUP DROITE — Vidéo + Quiz overlay ========== -->
  <g transform="translate(680, 130)" filter="url(#bigShadow)">
    <!-- Video player frame -->
    <rect x="0" y="0" width="540" height="380" rx="22" fill="url(#vidBg)"/>

    <!-- Contenu vidéo abstrait (silhouette + texte) -->
    <circle cx="160" cy="170" r="55" fill="#3A4378" opacity="0.6"/>
    <circle cx="148" cy="158" r="18" fill="#FFD89C" opacity="0.85"/>
    <path d="M 105 230 Q 160 205 215 230 L 215 270 L 105 270 Z" fill="#3A4378" opacity="0.6"/>

    <rect x="270" y="160" width="200" height="16" rx="8" fill="#5A6EF6" opacity="0.6"/>
    <rect x="270" y="186" width="160" height="11" rx="5" fill="#fff" opacity="0.3"/>
    <rect x="270" y="206" width="180" height="11" rx="5" fill="#fff" opacity="0.3"/>
    <rect x="270" y="226" width="140" height="11" rx="5" fill="#fff" opacity="0.3"/>

    <!-- Bottom controls + timeline -->
    <rect x="30" y="340" width="480" height="5" rx="2.5" fill="#fff" opacity="0.18"/>
    <rect x="30" y="340" width="180" height="5" rx="2.5" fill="#20BBE6"/>

    <!-- Quiz markers on timeline -->
    <circle cx="120" cy="342.5" r="7" fill="#20BBE6"/>
    <circle cx="210" cy="342.5" r="9" fill="#20BBE6" stroke="#fff" stroke-width="2"/>
    <circle cx="380" cy="342.5" r="7" fill="#5A6EF6"/>

    <!-- Pause icon + label -->
    <g transform="translate(30, 305)">
      <circle cx="14" cy="14" r="14" fill="#fff" opacity="0.95"/>
      <rect x="10" y="8" width="3.5" height="12" fill="#2B3264"/>
      <rect x="15" y="8" width="3.5" height="12" fill="#2B3264"/>
    </g>
    <text x="78" y="320" fill="#fff" opacity="0.85" font-weight="600" font-size="13">Vidéo en pause — quiz affiché à 1:24</text>
  </g>

  <!-- QUIZ OVERLAY POPPING OUT -->
  <g transform="translate(950, 175)" filter="url(#bigShadow)">
    <rect width="260" height="290" rx="22" fill="url(#quizBg)"/>

    <!-- chip Quiz 2/3 -->
    <rect x="20" y="22" width="90" height="26" rx="8" fill="url(#chipCyan)"/>
    <text x="65" y="40" text-anchor="middle" fill="#fff" font-weight="800" font-size="12">QUIZ 2/3</text>

    <!-- Question -->
    <text x="20" y="78" fill="#2B3264" font-weight="700" font-size="16">Quel est ton plus</text>
    <text x="20" y="100" fill="#2B3264" font-weight="700" font-size="16">gros défi en ce moment ?</text>

    <!-- Answer selected -->
    <rect x="20" y="118" width="220" height="34" rx="10" fill="#EBF1FE" stroke="#5A6EF6" stroke-width="2"/>
    <text x="34" y="139" fill="#2B3264" font-weight="600" font-size="13">📈  Plus de trafic</text>

    <!-- Other answers -->
    <rect x="20" y="158" width="220" height="34" rx="10" fill="#F4F7FE"/>
    <text x="34" y="179" fill="#5C6485" font-weight="500" font-size="13">🎯  Mieux qualifier</text>

    <rect x="20" y="198" width="220" height="34" rx="10" fill="#F4F7FE"/>
    <text x="34" y="219" fill="#5C6485" font-weight="500" font-size="13">💰  Plus de ventes</text>

    <!-- CTA -->
    <rect x="20" y="244" width="220" height="30" rx="15" fill="url(#ctaBg)"/>
    <text x="130" y="263" text-anchor="middle" fill="#fff" font-weight="800" font-size="13">Suivant →</text>
  </g>

  <!-- ========== CAS D'USAGE — 3 CARDS ========== -->
  <g transform="translate(80, 800)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="360" height="220" rx="20" fill="#fff" stroke="rgba(90,110,246,0.08)" stroke-width="1"/>
      <rect x="28" y="28" width="48" height="48" rx="14" fill="url(#ctaBg)"/>
      <polygon points="46,40 46,64 66,52" fill="#fff"/>
      <text x="28" y="110" fill="#2B3264" font-weight="800" font-size="18">Ta chaîne YouTube réveillée</text>
      <text x="28" y="146" fill="#5C6485" font-size="14">Tes anciennes vidéos qui dorment</text>
      <text x="28" y="168" fill="#5C6485" font-size="14">se mettent à capter des leads chaque</text>
      <text x="28" y="190" fill="#5C6485" font-size="14">jour, sans en tourner une nouvelle.</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(380, 0)" filter="url(#cardShadow)">
      <rect width="360" height="220" rx="20" fill="#fff" stroke="rgba(90,110,246,0.08)" stroke-width="1"/>
      <rect x="28" y="28" width="48" height="48" rx="14" fill="url(#ctaBg)"/>
      <circle cx="52" cy="52" r="16" fill="none" stroke="#fff" stroke-width="3"/>
      <line x1="52" y1="42" x2="52" y2="52" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="52" y1="52" x2="60" y2="56" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="28" y="110" fill="#2B3264" font-weight="800" font-size="18">Ton replay de webinaire</text>
      <text x="28" y="132" fill="#2B3264" font-weight="800" font-size="18">qui vend</text>
      <text x="28" y="160" fill="#5C6485" font-size="14">Le replay d'1 heure qui ne convertit</text>
      <text x="28" y="182" fill="#5C6485" font-size="14">plus devient un mini-tunnel qui</text>
      <text x="28" y="204" fill="#5C6485" font-size="14">qualifie chaque spectateur.</text>
    </g>
    <!-- Card 3 -->
    <g transform="translate(760, 0)" filter="url(#cardShadow)">
      <rect width="360" height="220" rx="20" fill="#fff" stroke="rgba(90,110,246,0.08)" stroke-width="1"/>
      <rect x="28" y="28" width="48" height="48" rx="14" fill="url(#ctaBg)"/>
      <polygon points="52,30 56,46 72,46 60,55 64,71 52,62 40,71 44,55 32,46 48,46" fill="#fff"/>
      <text x="28" y="110" fill="#2B3264" font-weight="800" font-size="18">Une vidéo virale à ton service</text>
      <text x="28" y="146" fill="#5C6485" font-size="14">Tu déposes un TED Talk pertinent</text>
      <text x="28" y="168" fill="#5C6485" font-size="14">dans Popquiz, tu glisses tes quiz,</text>
      <text x="28" y="190" fill="#5C6485" font-size="14">et le trafic devient ton trafic.</text>
    </g>
  </g>

</svg>
