<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter','Plus Jakarta Sans',-apple-system,system-ui,sans-serif;" role="img" aria-labelledby="t12 d12">
  <title id="t12">Tiquiz Popquiz vs concurrents : pourquoi tu paies 10 fois moins</title>
  <desc id="d12">Comparatif visuel du prix annuel sur 5 ans entre Tiquiz Popquiz et les outils concurrents (Wistia, Mindstamp, Vimeo Interactive, EdPuzzle)</desc>

  <defs>
    <linearGradient id="winBg12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF0FE"/>
      <stop offset="100%" stop-color="#E3F5FC"/>
    </linearGradient>
    <linearGradient id="brandGrad12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <filter id="shadow12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2E386E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .bg12 { fill: #F6F7FB; }
    .orb12-i { fill: #5A6EF6; opacity: 0.07; }
    .orb12-c { fill: #20BBE6; opacity: 0.07; }
    .hd12 { fill: #2E386E; font-weight: 900; font-size: 32px; letter-spacing: -0.03em; text-anchor: middle; }
    .sub12 { fill: #6B7280; font-weight: 500; font-size: 17px; text-anchor: middle; }
    .row-name { fill: #2E386E; font-weight: 700; font-size: 17px; }
    .row-flag { font-size: 14px; font-weight: 600; fill: #6B7280; }
    .price-old { fill: #9AA0B5; font-weight: 900; font-size: 24px; }
    .price-win { fill: #0EA2CB; font-weight: 900; font-size: 26px; }
    .src12 { fill: #9AA0B5; font-weight: 600; font-size: 12px; }
  </style>

  <rect class="bg12" x="0" y="0" width="1200" height="700" rx="24"/>
  <circle class="orb12-i" cx="180" cy="120" r="220"/>
  <circle class="orb12-c" cx="1020" cy="580" r="240"/>

  <text class="hd12" x="600" y="64">Coût total sur 5 ans : Tiquiz vs concurrents</text>
  <text class="sub12" x="600" y="98">Avec branchement Systeme io inclus pour Tiquiz, +Zapier pour les autres.</text>

  <!-- Ligne 1 — Wistia Soapbox -->
  <g transform="translate(60, 140)">
    <rect width="1080" height="65" rx="14" fill="#F0F2F7"/>
    <text class="row-name" x="20" y="32">Wistia Soapbox</text>
    <text class="row-flag" x="20" y="52">USA · 99 $/mois + Zapier (pour Systeme io)</text>
    <text class="price-old" x="1060" y="42" text-anchor="end">6 800 €</text>
  </g>

  <!-- Barre de proportion 1 (full = 6800) -->
  <g transform="translate(60, 215)">
    <rect width="1080" height="14" rx="7" fill="#E6E8F0"/>
    <rect width="1080" height="14" rx="7" fill="#9AA0B5"/>
  </g>

  <!-- Ligne 2 — Mindstamp -->
  <g transform="translate(60, 250)">
    <rect width="1080" height="65" rx="14" fill="#F0F2F7"/>
    <text class="row-name" x="20" y="32">Mindstamp</text>
    <text class="row-flag" x="20" y="52">USA · 25 $/mois + Zapier (pour Systeme io)</text>
    <text class="price-old" x="1060" y="42" text-anchor="end">2 800 €</text>
  </g>

  <g transform="translate(60, 325)">
    <rect width="1080" height="14" rx="7" fill="#E6E8F0"/>
    <rect width="445" height="14" rx="7" fill="#9AA0B5"/>
  </g>

  <!-- Ligne 3 — Vimeo Interactive -->
  <g transform="translate(60, 360)">
    <rect width="1080" height="65" rx="14" fill="#F0F2F7"/>
    <text class="row-name" x="20" y="32">Vimeo Interactive (Pro)</text>
    <text class="row-flag" x="20" y="52">USA · 25 $/mois + Zapier (pour Systeme io)</text>
    <text class="price-old" x="1060" y="42" text-anchor="end">2 800 €</text>
  </g>

  <g transform="translate(60, 435)">
    <rect width="1080" height="14" rx="7" fill="#E6E8F0"/>
    <rect width="445" height="14" rx="7" fill="#9AA0B5"/>
  </g>

  <!-- Ligne 4 — EdPuzzle Pro -->
  <g transform="translate(60, 470)">
    <rect width="1080" height="65" rx="14" fill="#F0F2F7"/>
    <text class="row-name" x="20" y="32">EdPuzzle Pro</text>
    <text class="row-flag" x="20" y="52">USA · 12,50 $/mois + Zapier</text>
    <text class="price-old" x="1060" y="42" text-anchor="end">1 800 €</text>
  </g>

  <g transform="translate(60, 545)">
    <rect width="1080" height="14" rx="7" fill="#E6E8F0"/>
    <rect width="285" height="14" rx="7" fill="#9AA0B5"/>
  </g>

  <!-- Ligne 5 — TIQUIZ (highlighted) -->
  <g transform="translate(60, 580)" filter="url(#shadow12)">
    <rect width="1080" height="65" rx="14" fill="url(#winBg12)" stroke="rgba(32,187,230,0.5)" stroke-width="2"/>
    <text class="row-name" x="20" y="32" fill="#0EA2CB" font-weight="900">Tiquiz Annuel · 90 €/an</text>
    <text class="row-flag" x="20" y="52" fill="#0EA2CB">France · branchement Systeme io en direct (zéro middleware)</text>
    <text class="price-win" x="1060" y="42" text-anchor="end">450 €</text>
  </g>

  <!-- Échelle / barre Tiquiz très petite -->
  <g transform="translate(60, 660)">
    <rect width="1080" height="14" rx="7" fill="#E6E8F0"/>
    <rect width="72" height="14" rx="7" fill="url(#brandGrad12)"/>
  </g>

  <text x="1160" y="690" fill="#9AA0B5" font-size="12" font-weight="600" text-anchor="end">— tipote.fr/tiquiz</text>
</svg>
