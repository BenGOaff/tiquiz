<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" style="font-family:'Open Sans','Inter',-apple-system,system-ui,sans-serif;" role="img" aria-labelledby="ecotit ecodesc">
  <title id="ecotit">L'effet écosystème Tipote : un filleul Tiquiz qui bascule sur Tipote multiplie ta rente par 14</title>
  <desc id="ecodesc">Animation en deux étapes : (1) l'affilié envoie un lead sur Tiquiz et touche 3,60 € par mois à 40 % à vie, (2) Béné relance le lead pour le basculer sur Tipote, l'affilié touche alors 49,50 € par mois à 50 % à vie, soit ×14 sans effort supplémentaire.</desc>
  <defs>
    <linearGradient id="brandG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <linearGradient id="cardTiquiz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF0FE"/>
      <stop offset="100%" stop-color="#E3F5FC"/>
    </linearGradient>
    <linearGradient id="cardTipote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#2B3264"/>
    </linearGradient>
    <linearGradient id="coinG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD86B"/>
      <stop offset="100%" stop-color="#F2B135"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2E386E" flood-opacity="0.12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- icône personne réutilisable -->
    <symbol id="person" viewBox="0 0 60 80">
      <circle cx="30" cy="20" r="14" fill="#FFFFFF" stroke="#2E386E" stroke-width="2.5"/>
      <path d="M8 76 Q8 48 30 48 Q52 48 52 76 Z" fill="#FFFFFF" stroke="#2E386E" stroke-width="2.5"/>
    </symbol>
    <!-- pièce € -->
    <symbol id="coin" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="url(#coinG)" stroke="#B8860B" stroke-width="1.5"/>
      <text x="20" y="27" text-anchor="middle" font-size="22" font-weight="900" fill="#7A5A0A">€</text>
    </symbol>
  </defs>
  <!-- fond -->
  <rect x="0" y="0" width="1200" height="760" fill="#F6F7FB" rx="20"/>
  <circle cx="180" cy="120" r="180" fill="#5A6EF6" opacity="0.05"/>
  <circle cx="1020" cy="640" r="220" fill="#20BBE6" opacity="0.05"/>
  <!-- =========== TITRE PRINCIPAL =========== -->
  <text x="600" y="50" text-anchor="middle" font-size="26" font-weight="900" fill="#2E386E" letter-spacing="-0.02em">L'effet écosystème Tipote sur ta rente</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" font-weight="500" fill="#6B7280">Un filleul Tiquiz que je fais basculer sur Tipote, c'est ×14 sur ta rente — sans effort de ta part</text>
  <!-- =========== ÉTAPE 1 — TIQUIZ (haut) =========== -->
  <g transform="translate(0, 110)">
    <rect x="40" y="0" width="1120" height="260" rx="18" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="1.5"/>
    <!-- pastille étape -->
    <rect x="60" y="20" width="190" height="30" rx="15" fill="#5A6EF6"/>
    <text x="155" y="40" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.05em">ÉTAPE 1 — TOI</text>
    <text x="270" y="40" font-size="14" font-weight="700" fill="#2E386E">tu amènes un filleul sur Tiquiz</text>
    <!-- Affilié -->
    <g transform="translate(85, 105)">
      <use href="#person" width="60" height="80"/>
      <text x="30" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">TOI</text>
      <text x="30" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">(affilié)</text>
    </g>
    <!-- Flèche 1 : Toi → Lead -->
    <g transform="translate(180, 145)">
      <line x1="0" y1="0" x2="115" y2="0" stroke="#5A6EF6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </line>
      <polygon points="115,-7 130,0 115,7" fill="#5A6EF6"/>
      <text x="65" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6EF6">ton lien tracké</text>
    </g>
    <!-- Lead (filleul) -->
    <g transform="translate(335, 105)">
      <use href="#person" width="60" height="80"/>
      <text x="30" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">FILLEUL</text>
    </g>
    <!-- Flèche 2 : Lead → Tiquiz -->
    <g transform="translate(430, 145)">
      <line x1="0" y1="0" x2="115" y2="0" stroke="#20BBE6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </line>
      <polygon points="115,-7 130,0 115,7" fill="#20BBE6"/>
      <text x="65" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#20BBE6">s'abonne</text>
    </g>
    <!-- Carte Tiquiz -->
    <g transform="translate(580, 80)" filter="url(#soft)">
      <rect x="0" y="0" width="200" height="130" rx="14" fill="url(#cardTiquiz)" stroke="rgba(32,187,230,0.5)" stroke-width="2"/>
      <text x="100" y="34" text-anchor="middle" font-size="16" font-weight="900" fill="#2E386E">TIQUIZ</text>
      <text x="100" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">abonnement mensuel</text>
      <text x="100" y="92" text-anchor="middle" font-size="30" font-weight="900" fill="#0EA2CB">9 €</text>
      <text x="100" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">/mois</text>
    </g>
    <!-- Flèche 3 : Tiquiz → rente affilié (descend puis tourne) -->
    <g transform="translate(800, 145)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#0EA2CB" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </line>
      <polygon points="100,-7 115,0 100,7" fill="#0EA2CB"/>
      <text x="50" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#0EA2CB">40 % à vie</text>
    </g>
    <!-- Pièce qui tombe (animée) -->
    <g>
      <use href="#coin" width="36" height="36" x="880" y="100">
        <animate attributeName="y" from="100" to="158" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.75;1" dur="1.4s" repeatCount="indefinite"/>
      </use>
    </g>
    <!-- Encart rente affilié -->
    <g transform="translate(940, 95)" filter="url(#soft)">
      <rect x="0" y="0" width="180" height="100" rx="14" fill="#EEF0FE" stroke="#5A6EF6" stroke-width="2"/>
      <text x="90" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#5A6EF6" letter-spacing="0.05em">TA RENTE</text>
      <text x="90" y="64" text-anchor="middle" font-size="26" font-weight="900" fill="#5A6EF6">3,60 €</text>
      <text x="90" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6EF6">par mois, à vie</text>
    </g>
  </g>
  <!-- =========== FLÈCHE DE PASSAGE ENTRE LES 2 ÉTAPES =========== -->
  <g transform="translate(600, 385)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#9AA0B5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="-7,30 0,42 7,30" fill="#9AA0B5"/>
    <text x="20" y="28" font-size="12" font-weight="700" fill="#6B7280" font-style="italic">quelques mois plus tard</text>
  </g>
  <!-- =========== ÉTAPE 2 — TIPOTE (bas) =========== -->
  <g transform="translate(0, 450)">
    <rect x="40" y="0" width="1120" height="280" rx="18" fill="#FFFFFF" stroke="#E6E8F0" stroke-width="1.5"/>
    <!-- pastille étape -->
    <rect x="60" y="20" width="200" height="30" rx="15" fill="#2B3264"/>
    <text x="160" y="40" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.05em">ÉTAPE 2 — MOI (BÉNÉ)</text>
    <text x="280" y="40" font-size="14" font-weight="700" fill="#2E386E">je fais basculer ton filleul sur Tipote</text>
    <!-- Béné -->
    <g transform="translate(85, 110)">
      <use href="#person" width="60" height="80"/>
      <circle cx="30" cy="20" r="14" fill="#5A6EF6" opacity="0.15"/>
      <text x="30" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">BÉNÉ</text>
      <text x="30" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">(fondatrice)</text>
    </g>
    <!-- Flèche email/relance -->
    <g transform="translate(180, 150)">
      <line x1="0" y1="0" x2="115" y2="0" stroke="#2B3264" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </line>
      <polygon points="115,-7 130,0 115,7" fill="#2B3264"/>
      <text x="65" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#2B3264">email + démo</text>
    </g>
    <!-- Lead (même filleul) -->
    <g transform="translate(335, 110)">
      <use href="#person" width="60" height="80"/>
      <text x="30" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#2E386E">FILLEUL</text>
      <text x="30" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">(toujours le tien)</text>
    </g>
    <!-- Flèche : Lead → Tipote -->
    <g transform="translate(430, 150)">
      <line x1="0" y1="0" x2="115" y2="0" stroke="#5A6EF6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </line>
      <polygon points="115,-7 130,0 115,7" fill="#5A6EF6"/>
      <text x="65" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6EF6">bascule sur</text>
    </g>
    <!-- Carte Tipote -->
    <g transform="translate(580, 80)" filter="url(#soft)">
      <rect x="0" y="0" width="200" height="150" rx="14" fill="url(#cardTipote)"/>
      <text x="100" y="34" text-anchor="middle" font-size="16" font-weight="900" fill="#FFFFFF">TIPOTE</text>
      <text x="100" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#C8CFFC">plan haut</text>
      <text x="100" y="98" text-anchor="middle" font-size="32" font-weight="900" fill="#FFFFFF">99 €</text>
      <text x="100" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#C8CFFC">/mois</text>
      <!-- petits orbes -->
      <circle cx="18" cy="20" r="3" fill="#20BBE6" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="183" cy="135" r="3" fill="#20BBE6" opacity="0.6">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- Flèche : Tipote → rente -->
    <g transform="translate(800, 150)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#5A6EF6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </line>
      <polygon points="100,-7 115,0 100,7" fill="#5A6EF6"/>
      <text x="50" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6EF6">50 % à vie</text>
    </g>
    <!-- Pluie de pièces (3 pièces décalées) -->
    <g>
      <use href="#coin" width="36" height="36" x="870" y="90">
        <animate attributeName="y" from="90" to="162" dur="1.4s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.75;1" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      </use>
      <use href="#coin" width="36" height="36" x="895" y="90">
        <animate attributeName="y" from="90" to="162" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.75;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      </use>
      <use href="#coin" width="36" height="36" x="920" y="90">
        <animate attributeName="y" from="90" to="162" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.75;1" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
      </use>
    </g>
    <!-- Encart rente affilié XL -->
    <g transform="translate(940, 80)" filter="url(#soft)">
      <rect x="0" y="0" width="180" height="130" rx="14" fill="url(#brandG)"/>
      <text x="90" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.05em">TA RENTE</text>
      <text x="90" y="76" text-anchor="middle" font-size="34" font-weight="900" fill="#FFFFFF">49,50 €</text>
      <text x="90" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">par mois, à vie</text>
      <!-- pulse -->
      <rect x="0" y="0" width="180" height="130" rx="14" fill="none" stroke="#FFD86B" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- Badge ×14 (collé en haut-droit de la carte rente, en sticker) -->
    <g transform="translate(1115, 82)">
      <circle r="28" fill="#FFD86B" stroke="#B8860B" stroke-width="2.5">
        <animate attributeName="r" values="26;30;26" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="7" text-anchor="middle" font-size="20" font-weight="900" fill="#7A5A0A">×14</text>
    </g>
    <!-- Sous-titre "sans effort de ta part" sous la carte rente -->
    <text x="1030" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#5A6EF6" font-style="italic">sans effort de ta part</text>
  </g>
</svg>
