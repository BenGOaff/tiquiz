<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter','Plus Jakarta Sans',-apple-system,system-ui,sans-serif;" role="img" aria-labelledby="t11 d11">
  <title id="t11">Popquiz timeline — placing 3 quizzes at key moments of a video</title>
  <desc id="d11">Tiquiz interface mockup showing a video with its timeline and 3 quiz moments placed at 0:30, 2:15 and 4:00</desc>

  <defs>
    <linearGradient id="videoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E386E"/>
      <stop offset="100%" stop-color="#1F2B5C"/>
    </linearGradient>
    <linearGradient id="popquizCue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <filter id="shadow11" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2E386E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .bg11 { fill: #F6F7FB; }
    .orb11-i { fill: #5A6EF6; opacity: 0.07; }
    .orb11-c { fill: #20BBE6; opacity: 0.07; }
    .hd11 { fill: #2E386E; font-weight: 900; font-size: 32px; letter-spacing: -0.03em; text-anchor: middle; }
    .sub11 { fill: #6B7280; font-weight: 500; font-size: 17px; text-anchor: middle; }
    .src11 { fill: #9AA0B5; font-weight: 600; font-size: 13px; }
  </style>

  <rect class="bg11" x="0" y="0" width="1200" height="700" rx="24"/>
  <circle class="orb11-i" cx="180" cy="120" r="220"/>
  <circle class="orb11-c" cx="1020" cy="580" r="240"/>

  <text class="hd11" x="600" y="64">You drop quiz moments on the video timeline.</text>
  <text class="sub11" x="600" y="98">One video, 3 quizzes at key moments. They answer, the video resumes.</text>

  <!-- VIDEO MOCKUP -->
  <g filter="url(#shadow11)">
    <rect x="100" y="160" width="1000" height="380" rx="20" fill="url(#videoBg)"/>
    <circle cx="600" cy="350" r="50" fill="#fff" opacity="0.95"/>
    <polygon points="585,330 585,370 620,350" fill="#2E386E"/>
    <text x="140" y="220" fill="#fff" font-weight="800" font-size="22">How to find your first clients</text>
    <text x="140" y="248" fill="#9AA0B5" font-weight="500" font-size="16">by Béné · 5:30 min</text>

    <rect x="140" y="490" width="920" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="140" y="490" width="280" height="6" rx="3" fill="url(#popquizCue)"/>
    <text x="140" y="525" fill="#9AA0B5" font-size="13">0:00</text>
    <text x="1060" y="525" fill="#9AA0B5" font-size="13" text-anchor="end">5:30</text>
  </g>

  <!-- Quiz 1 at 0:30 -->
  <g transform="translate(225, 470)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#20BBE6" stroke-width="3"/>
    <circle cx="0" cy="-12" r="22" fill="url(#popquizCue)"/>
    <text x="0" y="-7" text-anchor="middle" fill="#fff" font-weight="900" font-size="20">1</text>
    <rect x="-60" y="-90" width="120" height="58" rx="12" fill="#fff" stroke="rgba(32,187,230,0.4)" stroke-width="1.5"/>
    <text x="0" y="-67" text-anchor="middle" fill="#0EA2CB" font-weight="900" font-size="18">0:30</text>
    <text x="0" y="-47" text-anchor="middle" fill="#6B7280" font-size="13" font-weight="600">"Profile" quiz</text>
  </g>

  <!-- Quiz 2 at 2:15 -->
  <g transform="translate(517, 470)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#20BBE6" stroke-width="3"/>
    <circle cx="0" cy="-12" r="22" fill="url(#popquizCue)"/>
    <text x="0" y="-7" text-anchor="middle" fill="#fff" font-weight="900" font-size="20">2</text>
    <rect x="-60" y="-90" width="120" height="58" rx="12" fill="#fff" stroke="rgba(32,187,230,0.4)" stroke-width="1.5"/>
    <text x="0" y="-67" text-anchor="middle" fill="#0EA2CB" font-weight="900" font-size="18">2:15</text>
    <text x="0" y="-47" text-anchor="middle" fill="#6B7280" font-size="13" font-weight="600">"Pain point" quiz</text>
  </g>

  <!-- Quiz 3 at 4:00 -->
  <g transform="translate(811, 470)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#20BBE6" stroke-width="3"/>
    <circle cx="0" cy="-12" r="22" fill="url(#popquizCue)"/>
    <text x="0" y="-7" text-anchor="middle" fill="#fff" font-weight="900" font-size="20">3</text>
    <rect x="-60" y="-90" width="120" height="58" rx="12" fill="#fff" stroke="rgba(32,187,230,0.4)" stroke-width="1.5"/>
    <text x="0" y="-67" text-anchor="middle" fill="#0EA2CB" font-weight="900" font-size="18">4:00</text>
    <text x="0" y="-47" text-anchor="middle" fill="#6B7280" font-size="13" font-weight="600">"Buying" quiz</text>
  </g>

  <g transform="translate(0, 590)">
    <text x="600" y="0" text-anchor="middle" fill="#2E386E" font-weight="800" font-size="20">Each quiz triggers at the exact moment you've chosen.</text>
    <text x="600" y="32" text-anchor="middle" fill="#6B7280" font-weight="500" font-size="16">Blocking or optional mode per quiz, your call.</text>
  </g>

  <text class="src11" x="600" y="660" text-anchor="middle">Tiquiz Popquiz interface preview — /popquiz/new</text>

  <text x="1160" y="685" fill="#9AA0B5" font-size="12" font-weight="600" text-anchor="end">— tipote.blog/tiquiz</text>
</svg>
