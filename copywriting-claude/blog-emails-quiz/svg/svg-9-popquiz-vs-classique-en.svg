<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter','Plus Jakarta Sans',-apple-system,system-ui,sans-serif;" role="img" aria-labelledby="t9 d9">
  <title id="t9">Popquiz vs classic video — 100 views, 0 leads or 100 views, 40 leads</title>
  <desc id="d9">Comparison between a classic video without quiz capturing zero leads and a video with Popquiz capturing 30 to 40 tagged leads per 100 views</desc>

  <defs>
    <linearGradient id="winBg9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF0FE"/>
      <stop offset="100%" stop-color="#E3F5FC"/>
    </linearGradient>
    <linearGradient id="barGrad9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <filter id="shadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2E386E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .bg9 { fill: #F6F7FB; }
    .orb9-i { fill: #5A6EF6; opacity: 0.07; }
    .orb9-c { fill: #20BBE6; opacity: 0.07; }
    .hd9 { fill: #2E386E; font-weight: 900; font-size: 32px; letter-spacing: -0.03em; text-anchor: middle; }
    .sub9 { fill: #6B7280; font-weight: 500; font-size: 17px; text-anchor: middle; }
    .card-old9 { fill: #F0F2F7; stroke: #E6E8F0; stroke-width: 1.5; }
    .card-win9 { fill: url(#winBg9); stroke: rgba(32,187,230,0.3); stroke-width: 1.5; }
    .card-ttl-old9 { fill: #6B7280; font-weight: 900; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; }
    .card-ttl-win9 { fill: #0EA2CB; font-weight: 900; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; }
    .stat-label9 { fill: #6B7280; font-weight: 600; font-size: 16px; }
    .stat-label-win9 { fill: #2E386E; font-weight: 700; font-size: 16px; }
    .num-big9 { font-weight: 900; font-size: 88px; letter-spacing: -0.04em; }
    .num-old9 { fill: #9AA0B5; }
    .num-win9 { fill: #0EA2CB; }
    .src9 { fill: #9AA0B5; font-weight: 600; font-size: 13px; }
  </style>

  <rect class="bg9" x="0" y="0" width="1200" height="700" rx="24"/>
  <circle class="orb9-i" cx="180" cy="120" r="220"/>
  <circle class="orb9-c" cx="1020" cy="580" r="240"/>

  <text class="hd9" x="600" y="64">100 views on your video. How many leads?</text>
  <text class="sub9" x="600" y="98">Without a quiz: zero. With Popquiz: 30 to 40 leads sorted by profile.</text>

  <!-- LEFT CARD — Classic video -->
  <g filter="url(#shadow9)">
    <rect class="card-old9" x="60" y="150" width="480" height="450" rx="22"/>
  </g>
  <text class="card-ttl-old9" x="90" y="195">Classic video</text>

  <text class="stat-label9" x="90" y="265">Leads captured</text>
  <text class="num-big9 num-old9" x="90" y="395">0</text>
  <text class="stat-label9" x="90" y="430" font-size="14" fill="#9AA0B5">per 100 views</text>

  <g transform="translate(90, 480)">
    <text font-size="14" font-weight="600" fill="#9AA0B5">→ they watch, they scroll, they forget</text>
  </g>

  <!-- RIGHT CARD — Video with Popquiz -->
  <g filter="url(#shadow9)">
    <rect class="card-win9" x="660" y="150" width="480" height="450" rx="22"/>
  </g>
  <text class="card-ttl-win9" x="690" y="195">Video + Popquiz</text>

  <text class="stat-label-win9" x="690" y="265">Leads captured</text>
  <text class="num-big9 num-win9" x="690" y="395">30 to 40</text>
  <text class="stat-label-win9" x="690" y="430" font-size="14" fill="#0EA2CB">per 100 views, sorted by profile</text>

  <!-- Badge ×33 -->
  <g transform="translate(1050, 175)">
    <rect x="-50" y="-22" width="100" height="40" rx="20" fill="#20BBE6"/>
    <text x="0" y="7" fill="#fff" font-weight="900" font-size="20" text-anchor="middle">×33</text>
  </g>

  <g transform="translate(690, 480)">
    <text font-size="14" font-weight="700" fill="#0EA2CB">→ they answer, they get sorted, they buy</text>
  </g>

  <text class="src9" x="600" y="650" text-anchor="middle">Source: Interact Quiz Marketing Statistics — average lead-magnet quiz capture rate: 33.6%</text>

  <text x="1160" y="685" fill="#9AA0B5" font-size="12" font-weight="600" text-anchor="end">— tipote.blog/tiquiz</text>
</svg>
