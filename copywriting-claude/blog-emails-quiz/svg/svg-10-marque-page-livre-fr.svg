<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter','Plus Jakarta Sans',-apple-system,system-ui,sans-serif;" role="img" aria-labelledby="t10 d10">
  <title id="t10">Le livre est à son auteur. Le marque-page est à toi.</title>
  <desc id="d10">Schéma illustrant la métaphore du marque-page glissé dans un livre prêté pour expliquer la légalité du Popquiz : la vidéo (le livre) reste à son auteur, le quiz (le marque-page) appartient à celui qui l'a posé</desc>

  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E386E"/>
      <stop offset="100%" stop-color="#1F2B5C"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A6EF6"/>
      <stop offset="100%" stop-color="#20BBE6"/>
    </linearGradient>
    <filter id="shadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#2E386E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .bg10 { fill: #F6F7FB; }
    .orb10-i { fill: #5A6EF6; opacity: 0.07; }
    .orb10-c { fill: #20BBE6; opacity: 0.07; }
    .hd10 { fill: #2E386E; font-weight: 900; font-size: 36px; letter-spacing: -0.03em; text-anchor: middle; }
    .sub10 { fill: #6B7280; font-weight: 500; font-size: 18px; text-anchor: middle; }
    .label-book { fill: #2E386E; font-weight: 800; font-size: 22px; }
    .label-mark { fill: #0EA2CB; font-weight: 800; font-size: 22px; }
    .src10 { fill: #9AA0B5; font-weight: 600; font-size: 13px; }
  </style>

  <rect class="bg10" x="0" y="0" width="1200" height="700" rx="24"/>
  <circle class="orb10-i" cx="180" cy="120" r="220"/>
  <circle class="orb10-c" cx="1020" cy="580" r="240"/>

  <text class="hd10" x="600" y="74">Le livre est à son auteur. Le marque-page est à toi.</text>
  <text class="sub10" x="600" y="108">Tu n'enlèves rien à la vidéo. Tu glisses juste ton quiz par-dessus.</text>

  <!-- LIVRE (rectangle profond avec dos) -->
  <g filter="url(#shadow10)">
    <!-- Dos du livre (côté) -->
    <rect x="380" y="200" width="40" height="380" rx="4" fill="#1F2B5C"/>
    <!-- Couverture du livre -->
    <rect x="420" y="200" width="400" height="380" rx="6" fill="url(#bookGrad)"/>
    <!-- Lignes de texture sur la couverture -->
    <line x1="450" y1="240" x2="790" y2="240" stroke="#5A6EF6" stroke-width="2" opacity="0.4"/>
    <line x1="450" y1="270" x2="790" y2="270" stroke="#5A6EF6" stroke-width="2" opacity="0.3"/>
    <line x1="450" y1="300" x2="730" y2="300" stroke="#5A6EF6" stroke-width="2" opacity="0.3"/>
    <!-- Titre fictif sur le livre -->
    <text x="620" y="500" text-anchor="middle" fill="#fff" font-weight="900" font-size="28" letter-spacing="0.05em">▶ VIDÉO</text>
    <text x="620" y="540" text-anchor="middle" fill="#9AA0B5" font-weight="500" font-size="16">par son auteur</text>
  </g>

  <!-- MARQUE-PAGE (rectangle qui dépasse du livre par le haut) -->
  <g filter="url(#shadow10)">
    <rect x="640" y="160" width="100" height="180" rx="4" fill="url(#markGrad)"/>
    <!-- Encoche en bas -->
    <polygon points="640,340 690,310 740,340" fill="url(#markGrad)"/>
    <!-- Logo Tiquiz / Quiz badge -->
    <text x="690" y="240" text-anchor="middle" fill="#fff" font-weight="900" font-size="42" letter-spacing="-0.03em">?</text>
    <text x="690" y="290" text-anchor="middle" fill="#fff" font-weight="800" font-size="14" letter-spacing="0.05em">QUIZ</text>
  </g>

  <!-- Légende livre (gauche, flèche) -->
  <g transform="translate(120, 380)">
    <rect width="240" height="80" rx="14" fill="#fff" stroke="#E6E8F0" stroke-width="2"/>
    <text class="label-book" x="20" y="35">Le livre</text>
    <text x="20" y="62" fill="#6B7280" font-size="14">= la vidéo de son auteur</text>
    <!-- Flèche vers le livre -->
    <line x1="240" y1="40" x2="370" y2="40" stroke="#2E386E" stroke-width="2.5"/>
    <polygon points="370,40 360,34 360,46" fill="#2E386E"/>
  </g>

  <!-- Légende marque-page (droite, flèche) -->
  <g transform="translate(840, 200)">
    <rect width="240" height="80" rx="14" fill="#fff" stroke="rgba(32,187,230,0.4)" stroke-width="2"/>
    <text class="label-mark" x="20" y="35">Le marque-page</text>
    <text x="20" y="62" fill="#6B7280" font-size="14">= ton quiz Popquiz</text>
    <!-- Flèche vers le marque-page -->
    <line x1="0" y1="40" x2="-100" y2="40" stroke="#0EA2CB" stroke-width="2.5"/>
    <polygon points="-100,40 -90,34 -90,46" fill="#0EA2CB"/>
  </g>

  <!-- Texte conclusion -->
  <text x="600" y="640" text-anchor="middle" fill="#2E386E" font-weight="800" font-size="22">Personne ne perd. Tout le monde gagne.</text>

  <text x="1160" y="685" fill="#9AA0B5" font-size="12" font-weight="600" text-anchor="end">— tipote.fr/tiquiz</text>
</svg>
