<!--
  LA MENTION DISCRÈTE, À LA PLACE DU WIDGET ANIMÉ (Béné, 2 septembre 2026)

  "Peut être qu'on peut modifier ou supprimer la partie sur le premier
  outil de quiz connecté à Systeme io ? en faire une mention plus
  discrète à un endroit stratégique ? On explique assez bien le parcours
  ailleurs il me semble."

  Elle a raison, et c'est mesurable. Le widget qui vivait ici
  (#tqz-scoop-widget, 18,5 Ko, cinq scènes animées, dix-huit confettis en
  CSS et un script de boucle) racontait exactement le parcours que la
  page explique DÉJÀ trois fois autour de lui :

  - la section qui le porte (section-3fe5bb60) EST le mécanisme, avec le
    comparatif et les 4 étapes ;
  - le bloc "où vit ton quiz" dit où le quiz est servi ;
  - le bloc "quand ça tourne" dit ce qui part chez Systeme.io, tag par
    tag (`lib/automatisation/planSysteme.ts`).

  Une animation qui rejoue en boucle un parcours déjà écrit ne convainc
  personne de plus : elle retarde la lecture de ce qui, lui, est neuf.

  CE QUI RESTE, ET POURQUOI IL RESTE : la phrase elle même. "Connecté à
  Systeme.io" est la requête la plus rentable du produit (elle porte le
  <title> et tout le hub /integrations), et c'est le seul argument que
  ni Tally, ni Typeform, ni Interact ne peuvent écrire. On retire le
  spectacle, pas le différenciateur.

  ET LE FAIT EST VÉRIFIÉ, ce n'est pas une formule : le tag est CRÉÉ
  chez Systeme.io quand il manque (`app/api/quiz/[quizId]/public/
  route.ts` fait POST /tags avant de le poser sur le contact). C'est
  exactement ce que Zapier ne sait pas faire, et c'est écrit noir sur
  blanc sur /integrations/interact, citation de leur documentation à
  l'appui.
-->
