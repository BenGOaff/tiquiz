     NE PAS RETOUCHER À LA MAIN : relance le script.
     Ce que ce bloc MONTRE : Un PDF qu'on ne lit pas contre un quiz auquel on répond. -->
<style>
.tqvs *{margin:0;padding:0;box-sizing:border-box}
.tqvs{width:100%;max-width:560px;margin:0 auto;padding:30px 10px 26px;position:relative;font-family:'Inter','Open Sans',sans-serif}
.tqvs-duel{display:flex;gap:18px;align-items:stretch;position:relative}
.tqvs-card{position:relative;flex:1 1 0;background:#fff;border-radius:20px;box-shadow:0 12px 38px rgba(43,50,100,.12);padding:22px 18px 20px;min-width:0;opacity:0}
.tqvs-card.pdf{transform:translateY(20px) rotate(-1.5deg)}
.tqvs-card.qz{transform:translateY(20px) rotate(1.5deg)}
.tqvs-h{font-size:11.5px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:14px}
.tqvs-card.pdf .tqvs-h{color:#8A93B8}
.tqvs-card.qz .tqvs-h{color:#20BBE6}
.tqvs-ico{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;position:relative}
.tqvs-card.pdf .tqvs-ico{background:#EEF1F8}
.tqvs-card.qz .tqvs-ico{background:linear-gradient(135deg,#20BBE7,#5A6EF6)}
.tqvs-ico svg{width:26px;height:26px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tqvs-card.pdf .tqvs-ico svg{stroke:#8A93B8}
.tqvs-card.qz .tqvs-ico svg{stroke:#fff}
.tqvs-sleep{position:absolute;right:-7px;top:-7px;font-size:17px;opacity:0;transform:scale(.4)}
.tqvs-chip{display:flex;align-items:center;gap:7px;background:#F3F6FC;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700;color:#2B3264;margin-bottom:8px;opacity:0;transform:translateX(-12px);white-space:nowrap;overflow:hidden}
.tqvs-chip svg{width:14px;height:14px;flex:none;fill:none;stroke:#5A6EF6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tqvs-card.pdf .tqvs-chip svg{stroke:#8A93B8}
.tqvs-chip.tag{background:#5E6DDE;color:#fff}
.tqvs-chip.tag .tg-s{display:none}
.tqvs-chip.tag svg{stroke:#fff}
.tqvs-empty{font-size:12px;font-weight:700;color:#B0B8D4;margin-top:4px;opacity:0}
.tqvs-dim{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.55);opacity:0;pointer-events:none}
.tqvs-zz{position:absolute;top:6px;right:14px;font-size:16px;font-weight:900;color:#B9C2DB;opacity:0}
.tqvs-zz.z2{right:30px;top:20px;font-size:12px}
/* VS medallion */
.tqvs-vs{position:absolute;left:50%;top:30px;transform:translate(-50%,0) scale(.3);width:48px;height:48px;border-radius:50%;background:#2B3264;color:#fff;font-size:16px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(43,50,100,.35);border:3px solid #fff;z-index:3;opacity:0}
/* ×5 badge + confetti */
.tqvs-x5{position:absolute;top:-16px;right:-8px;background:linear-gradient(135deg,#20BBE7,#5A6EF6);color:#fff;font-size:15px;font-weight:900;padding:9px 14px;border-radius:50px;box-shadow:0 10px 26px rgba(90,110,246,.45);opacity:0;transform:scale(.4);z-index:2}
.tqvs-cf{position:absolute;top:-6px;right:24px;width:7px;height:11px;border-radius:2px;opacity:0;z-index:1}
.tqvs-cf.f1{background:#20BBE6}
.tqvs-cf.f2{background:#FFD700;right:8px;width:6px;height:6px;border-radius:50%}
.tqvs-cf.f3{background:#5A6EF6;right:44px}
.tqvs-cf.f4{background:#FF6663;right:60px;width:6px;height:6px;border-radius:50%}
.tqvs-cf.f5{background:#10B981;right:-4px}
.tqvs-cf.f6{background:#8B5CF6;right:34px;width:5px;height:9px}
/* punchline */
.tqvs-punch{margin:22px auto 0;text-align:center;opacity:0;transform:translateY(12px)}
.tqvs-punch span{display:inline-block;background:#fff;border:1.5px solid rgba(32,187,230,.4);color:#2B3264;font-size:14.5px;font-weight:700;padding:12px 22px;border-radius:50px;box-shadow:0 10px 28px rgba(43,50,100,.09);line-height:1.4}
.tqvs-punch b{background:linear-gradient(90deg,#20BBE7,#5A6EF6);-webkit-background-clip:text;background-clip:text;color:transparent}
/* ── ANIMATIONS AU SCROLL ── */
.tqvs.tqz-visible .tqvs-card.pdf{animation:tqvsUpL .65s cubic-bezier(.34,1.56,.64,1) forwards .2s,tqvsSink 1s ease forwards 3s}
.tqvs.tqz-visible .tqvs-card.qz{animation:tqvsUpR .65s cubic-bezier(.34,1.56,.64,1) forwards .4s,tqvsGlow 1.6s ease 3.9s 2,tqvsFloat 5s ease-in-out 6.5s infinite}
.tqvs.tqz-visible .tqvs-vs{animation:tqvsVs .55s cubic-bezier(.34,1.56,.64,1) forwards .85s}
.tqvs.tqz-visible .pdf .tqvs-c1{animation:tqvsChip .45s ease forwards 1.2s}
.tqvs.tqz-visible .pdf .tqvs-c2{animation:tqvsChip .45s ease forwards 1.7s}
.tqvs.tqz-visible .tqvs-empty{animation:tqvsFade .6s ease forwards 3.2s}
.tqvs.tqz-visible .tqvs-dim{animation:tqvsFade .9s ease forwards 3s}
.tqvs.tqz-visible .tqvs-sleep{animation:tqvsPop .5s cubic-bezier(.34,1.56,.64,1) forwards 3.4s}
.tqvs.tqz-visible .tqvs-zz.z1{animation:tqvsZz 2.6s ease-in-out 3.6s infinite}
.tqvs.tqz-visible .tqvs-zz.z2{animation:tqvsZz 2.6s ease-in-out 4.2s infinite}
.tqvs.tqz-visible .qz .tqvs-c1{animation:tqvsChip .45s ease forwards 1.4s}
.tqvs.tqz-visible .qz .tqvs-c2{animation:tqvsChip .45s ease forwards 1.8s}
.tqvs.tqz-visible .qz .tqvs-c3{animation:tqvsChip .45s ease forwards 2.2s}
.tqvs.tqz-visible .qz .tqvs-c4{animation:tqvsChip .45s ease forwards 2.6s}
.tqvs.tqz-visible .qz .tqvs-c5{animation:tqvsChip .5s ease forwards 3.1s}
.tqvs.tqz-visible .tqvs-x5{animation:tqvsPop .55s cubic-bezier(.34,1.56,.64,1) forwards 3.8s}
.tqvs.tqz-visible .tqvs-cf{animation:tqvsConf 1.6s ease forwards 4s}
.tqvs.tqz-visible .tqvs-cf.f2{animation-delay:4.05s}
.tqvs.tqz-visible .tqvs-cf.f3{animation-delay:4.1s}
.tqvs.tqz-visible .tqvs-cf.f4{animation-delay:4.02s}
.tqvs.tqz-visible .tqvs-cf.f5{animation-delay:4.08s}
.tqvs.tqz-visible .tqvs-cf.f6{animation-delay:4.12s}
.tqvs.tqz-visible .tqvs-punch{animation:tqvsUp .6s cubic-bezier(.34,1.56,.64,1) forwards 4.3s}
@keyframes tqvsUpL{to{opacity:1;transform:translateY(0) rotate(-1.5deg)}}
@keyframes tqvsUpR{to{opacity:1;transform:translateY(0) rotate(1.5deg)}}
@keyframes tqvsUp{to{opacity:1;transform:translateY(0)}}
@keyframes tqvsVs{to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes tqvsChip{to{opacity:1;transform:translateX(0)}}
@keyframes tqvsFade{to{opacity:1}}
@keyframes tqvsPop{to{opacity:1;transform:scale(1)}}
@keyframes tqvsSink{to{opacity:1;transform:translateY(8px) rotate(-3deg)}}
@keyframes tqvsGlow{0%,100%{box-shadow:0 12px 38px rgba(43,50,100,.12)}50%{box-shadow:0 14px 46px rgba(32,187,230,.38)}}
@keyframes tqvsFloat{0%,100%{transform:translateY(0) rotate(1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
@keyframes tqvsZz{0%{opacity:0;transform:translateY(0)}25%{opacity:1}70%{opacity:0;transform:translateY(-15px)}100%{opacity:0}}
@keyframes tqvsConf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(70px) rotate(340deg)}}
@media(max-width:500px){
.tqvs{padding:24px 6px 20px}
.tqvs-duel{gap:10px}
.tqvs-card{padding:18px 12px 16px}
.tqvs-chip{font-size:11px;padding:8px 8px;gap:5px}
.tqvs-chip.tag{font-size:10.5px;padding:8px 6px;gap:4px}
.tqvs-chip.tag .tg-l{display:none}
.tqvs-chip.tag .tg-s{display:inline}
.tqvs-vs{width:40px;height:40px;font-size:13px;top:24px}
.tqvs-x5{right:0;top:-14px;font-size:13px;padding:8px 12px}
.tqvs-punch span{font-size:12.5px;padding:10px 14px}
}
</style>
