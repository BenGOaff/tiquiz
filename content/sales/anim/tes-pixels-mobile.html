     NE PAS RETOUCHER À LA MAIN : relance le script.
     Ce que ce bloc MONTRE : La même chose, la variante mobile de sa page. -->
<style>
.tqpxmb *{margin:0;padding:0;box-sizing:border-box}
.tqpxmb{width:100%;max-width:520px;margin:0 auto;padding:26px 8px;position:relative;font-family:'Inter','Open Sans',sans-serif}
.tqpxmb-row{display:flex;gap:16px;align-items:stretch;position:relative}
.tqpxmb-card{flex:1 1 0;background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(43,50,100,.11);padding:20px 16px 18px;min-width:0;opacity:0;transform:translateY(18px)}
.tqpxmb-h{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:10px}
.tqpxmb-card.pro .tqpxmb-h{color:#20BBE6}
.tqpxmb-card.sco .tqpxmb-h{color:#5E6DDE}
.tqpxmb-ban{display:inline-block;font-size:12px;font-weight:800;padding:6px 12px;border-radius:50px;margin-bottom:16px;opacity:0;transform:scale(.6)}
.tqpxmb-card.pro .tqpxmb-ban{background:rgba(32,187,230,.12);color:#1499BE}
.tqpxmb-card.sco .tqpxmb-ban{background:rgba(94,109,222,.12);color:#5E6DDE}
.tqpxmb-p{display:flex;align-items:center;gap:8px;background:#F3F6FC;border-radius:11px;padding:9px 11px;font-size:13px;font-weight:700;color:#2B3264;margin-bottom:8px;opacity:0;transform:translateX(-10px);transition:none}
.tqpxmb-p .em{font-size:15px;flex:none}
.tqpxmb-p.win{position:relative}
.tqpxmb-ok{margin-left:auto;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#20BBE7,#5A6EF6);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4)}
.tqpxmb-res{margin-top:12px;font-size:14px;font-weight:800;color:#2B3264;opacity:0}
.tqpxmb-res b{color:#20BBE6}
/* scored card */
.tqpxmb-score{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.tqpxmb-score b{font-size:40px;font-weight:900;color:#2B3264;line-height:1;letter-spacing:-0.03em}
.tqpxmb-score span{font-size:15px;color:#8A93B8;font-weight:700}
.tqpxmb-gauge{height:11px;border-radius:50px;background:#EDF1F7;overflow:hidden;margin-bottom:14px}
.tqpxmb-gauge i{display:block;height:100%;width:0;border-radius:50px;background:linear-gradient(90deg,#20BBE7,#5A6EF6)}
.tqpxmb-lvl{display:inline-block;background:rgba(94,109,222,.1);color:#5E6DDE;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:50px;opacity:0;transform:scale(.6);margin-bottom:12px}
.tqpxmb-mini{margin-bottom:9px}
.tqpxmb-mini label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#5C6485;margin-bottom:4px}
.tqpxmb-mini .bar{height:7px;border-radius:50px;background:#EDF1F7;overflow:hidden}
.tqpxmb-mini .bar i{display:block;height:100%;width:0;border-radius:50px;background:linear-gradient(90deg,#20BBE7,#5A6EF6)}
/* OU pill */
.tqpxmb-ou{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.5);background:#2B3264;color:#fff;font-size:13px;font-weight:900;letter-spacing:1px;padding:9px 14px;border-radius:50px;box-shadow:0 8px 24px rgba(43,50,100,.3);z-index:2;opacity:0}
/* footer strip */
.tqpxmb-foot{margin:18px auto 0;text-align:center;opacity:0;transform:translateY(10px)}
.tqpxmb-foot span{display:inline-block;background:#fff;border:1px solid rgba(32,187,230,.35);color:#2B3264;font-size:13px;font-weight:700;padding:10px 18px;border-radius:50px;box-shadow:0 8px 24px rgba(43,50,100,.08)}
.tqpxmb-foot b{color:#5E6DDE}
/* ── ANIMATIONS AU SCROLL ── */
.tqpxmb.tqz-visible .tqpxmb-card.pro{animation:tqpxmbUp .6s cubic-bezier(.34,1.56,.64,1) forwards .2s,tqpxmbFloat 5s ease-in-out 4.2s infinite}
.tqpxmb.tqz-visible .tqpxmb-card.sco{animation:tqpxmbUp .6s cubic-bezier(.34,1.56,.64,1) forwards .45s,tqpxmbFloatAlt 5.5s ease-in-out 4.6s infinite}
.tqpxmb.tqz-visible .tqpxmb-ou{animation:tqpxmbPop .5s cubic-bezier(.34,1.56,.64,1) forwards 1s}
.tqpxmb.tqz-visible .pro .tqpxmb-ban{animation:tqpxmbPop .45s cubic-bezier(.34,1.56,.64,1) forwards .9s}
.tqpxmb.tqz-visible .sco .tqpxmb-ban{animation:tqpxmbPop .45s cubic-bezier(.34,1.56,.64,1) forwards 1.1s}
.tqpxmb.tqz-visible .tqpxmb-p1{animation:tqpxmbChip .4s ease forwards 1.3s}
.tqpxmb.tqz-visible .tqpxmb-p2{animation:tqpxmbChip .4s ease forwards 1.6s}
.tqpxmb.tqz-visible .tqpxmb-p3{animation:tqpxmbChip .4s ease forwards 1.9s}
.tqpxmb.tqz-visible .tqpxmb-p1 .tqpxmb-ok{animation:tqpxmbPop .45s cubic-bezier(.34,1.56,.64,1) forwards 2.5s}
.tqpxmb.tqz-visible .tqpxmb-fade2{animation:tqpxmbChip .4s ease forwards 1.6s,tqpxmbDim .6s ease forwards 2.6s}
.tqpxmb.tqz-visible .tqpxmb-fade3{animation:tqpxmbChip .4s ease forwards 1.9s,tqpxmbDim .6s ease forwards 2.6s}
.tqpxmb.tqz-visible .tqpxmb-res{animation:tqpxmbFade .6s ease forwards 2.9s}
.tqpxmb.tqz-visible .tqpxmb-gauge i{animation:tqpxmbGauge 1.4s cubic-bezier(.25,.6,.3,1) forwards 1.5s}
.tqpxmb.tqz-visible .tqpxmb-lvl{animation:tqpxmbPop .5s cubic-bezier(.34,1.56,.64,1) forwards 2.7s}
.tqpxmb.tqz-visible .tqpxmb-m1 i{animation:tqpxmbB1 1s cubic-bezier(.25,.6,.3,1) forwards 2s}
.tqpxmb.tqz-visible .tqpxmb-m2 i{animation:tqpxmbB2 1s cubic-bezier(.25,.6,.3,1) forwards 2.25s}
.tqpxmb.tqz-visible .tqpxmb-foot{animation:tqpxmbUp .6s ease forwards 3.4s}
@keyframes tqpxmbUp{to{opacity:1;transform:translateY(0)}}
@keyframes tqpxmbChip{to{opacity:1;transform:translateX(0)}}
@keyframes tqpxmbPop{to{opacity:1;transform:scale(1)}}
@keyframes tqpxmbFade{to{opacity:1}}
@keyframes tqpxmbDim{to{opacity:.4}}
@keyframes tqpxmbGauge{to{width:68%}}
@keyframes tqpxmbB1{to{width:50%}}
@keyframes tqpxmbB2{to{width:80%}}
@keyframes tqpxmbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tqpxmbFloatAlt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:500px){
.tqpxmb{padding:20px 6px}
.tqpxmb-row{flex-direction:column;gap:12px}
.tqpxmb-card{padding:18px 16px 16px}
.tqpxmb-score b{font-size:34px}
.tqpxmb-ou{position:static;order:1;align-self:center;transform:scale(.6);margin:-2px 0}
.tqpxmb-card.pro{order:0}
.tqpxmb-card.sco{order:2}
}
</style>
<div class="tqpxmb" id="tqpxmb-widget">
<div class="tqpxmb-row">
<div class="tqpxmb-card pro">
<div class="tqpxmb-h">Quiz par profil</div>
<div><span class="tqpxmb-ban">Révèle QUI ils sont</span></div>
<div class="tqpxmb-p tqpxmb-p1 win"><span class="em">🎯</span>Stratège<span class="tqpxmb-ok">✓</span></div>
<div class="tqpxmb-p tqpxmb-p2 tqpxmb-fade2"><span class="em">🎨</span>Créatif</div>
<div class="tqpxmb-p tqpxmb-p3 tqpxmb-fade3"><span class="em">🚀</span>Fonceur</div>
<div class="tqpxmb-res">Profil : <b>Stratège</b> → segmente &amp; personnalise</div>
</div>
<div class="tqpxmb-ou">OU</div>
<div class="tqpxmb-card sco">
<div class="tqpxmb-h">Quiz scoré</div>
<div><span class="tqpxmb-ban">Mesure OÙ ils en sont</span></div>
<div class="tqpxmb-score"><b>68</b><span>/100</span></div>
<div class="tqpxmb-gauge"><i></i></div>
<div><span class="tqpxmb-lvl">Niveau : en bonne voie</span></div>
<div class="tqpxmb-mini tqpxmb-m1"><label><span>Sommeil</span><span>50</span></label><div class="bar"><i></i></div></div>
<div class="tqpxmb-mini tqpxmb-m2"><label><span>Émotions</span><span>80</span></label><div class="bar"><i></i></div></div>
</div>
</div>
<div class="tqpxmb-foot"><span>Dans les deux cas : <b>+1 tag Systeme.io</b> selon le résultat ✓</span></div>
</div>
