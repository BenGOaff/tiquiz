     NE PAS RETOUCHER À LA MAIN : relance le script.
     Ce que ce bloc MONTRE : Les pixels Meta, Analytics et Ads qui se posent sur le quiz. -->
<style>
.tqpx *{margin:0;padding:0;box-sizing:border-box}
.tqpx{width:100%;max-width:520px;margin:0 auto;padding:26px 8px;position:relative;font-family:'Inter','Open Sans',sans-serif}
.tqpx-row{display:flex;gap:16px;align-items:stretch;position:relative}
.tqpx-card{flex:1 1 0;background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(43,50,100,.11);padding:20px 16px 18px;min-width:0;opacity:0;transform:translateY(18px)}
.tqpx-h{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:10px}
.tqpx-card.pro .tqpx-h{color:#20BBE6}
.tqpx-card.sco .tqpx-h{color:#5E6DDE}
.tqpx-ban{display:inline-block;font-size:12px;font-weight:800;padding:6px 12px;border-radius:50px;margin-bottom:16px;opacity:0;transform:scale(.6)}
.tqpx-card.pro .tqpx-ban{background:rgba(32,187,230,.12);color:#1499BE}
.tqpx-card.sco .tqpx-ban{background:rgba(94,109,222,.12);color:#5E6DDE}
.tqpx-p{display:flex;align-items:center;gap:8px;background:#F3F6FC;border-radius:11px;padding:9px 11px;font-size:13px;font-weight:700;color:#2B3264;margin-bottom:8px;opacity:0;transform:translateX(-10px);transition:none}
.tqpx-p .em{font-size:15px;flex:none}
.tqpx-p.win{position:relative}
.tqpx-ok{margin-left:auto;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#20BBE7,#5A6EF6);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.4)}
.tqpx-res{margin-top:12px;font-size:14px;font-weight:800;color:#2B3264;opacity:0}
.tqpx-res b{color:#20BBE6}
/* scored card */
.tqpx-score{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.tqpx-score b{font-size:40px;font-weight:900;color:#2B3264;line-height:1;letter-spacing:-0.03em}
.tqpx-score span{font-size:15px;color:#8A93B8;font-weight:700}
.tqpx-gauge{height:11px;border-radius:50px;background:#EDF1F7;overflow:hidden;margin-bottom:14px}
.tqpx-gauge i{display:block;height:100%;width:0;border-radius:50px;background:linear-gradient(90deg,#20BBE7,#5A6EF6)}
.tqpx-lvl{display:inline-block;background:rgba(94,109,222,.1);color:#5E6DDE;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:50px;opacity:0;transform:scale(.6);margin-bottom:12px}
.tqpx-mini{margin-bottom:9px}
.tqpx-mini label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#5C6485;margin-bottom:4px}
.tqpx-mini .bar{height:7px;border-radius:50px;background:#EDF1F7;overflow:hidden}
.tqpx-mini .bar i{display:block;height:100%;width:0;border-radius:50px;background:linear-gradient(90deg,#20BBE7,#5A6EF6)}
/* OU pill */
.tqpx-ou{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.5);background:#2B3264;color:#fff;font-size:13px;font-weight:900;letter-spacing:1px;padding:9px 14px;border-radius:50px;box-shadow:0 8px 24px rgba(43,50,100,.3);z-index:2;opacity:0}
/* footer strip */
.tqpx-foot{margin:18px auto 0;text-align:center;opacity:0;transform:translateY(10px)}
.tqpx-foot span{display:inline-block;background:#fff;border:1px solid rgba(32,187,230,.35);color:#2B3264;font-size:13px;font-weight:700;padding:10px 18px;border-radius:50px;box-shadow:0 8px 24px rgba(43,50,100,.08)}
.tqpx-foot b{color:#5E6DDE}
/* ── ANIMATIONS AU SCROLL ── */
.tqpx.tqz-visible .tqpx-card.pro{animation:tqpxUp .6s cubic-bezier(.34,1.56,.64,1) forwards .2s,tqpxFloat 5s ease-in-out 4.2s infinite}
.tqpx.tqz-visible .tqpx-card.sco{animation:tqpxUp .6s cubic-bezier(.34,1.56,.64,1) forwards .45s,tqpxFloatAlt 5.5s ease-in-out 4.6s infinite}
.tqpx.tqz-visible .tqpx-ou{animation:tqpxPop .5s cubic-bezier(.34,1.56,.64,1) forwards 1s}
.tqpx.tqz-visible .pro .tqpx-ban{animation:tqpxPop .45s cubic-bezier(.34,1.56,.64,1) forwards .9s}
.tqpx.tqz-visible .sco .tqpx-ban{animation:tqpxPop .45s cubic-bezier(.34,1.56,.64,1) forwards 1.1s}
.tqpx.tqz-visible .tqpx-p1{animation:tqpxChip .4s ease forwards 1.3s}
.tqpx.tqz-visible .tqpx-p2{animation:tqpxChip .4s ease forwards 1.6s}
.tqpx.tqz-visible .tqpx-p3{animation:tqpxChip .4s ease forwards 1.9s}
.tqpx.tqz-visible .tqpx-p1 .tqpx-ok{animation:tqpxPop .45s cubic-bezier(.34,1.56,.64,1) forwards 2.5s}
.tqpx.tqz-visible .tqpx-fade2{animation:tqpxChip .4s ease forwards 1.6s,tqpxDim .6s ease forwards 2.6s}
.tqpx.tqz-visible .tqpx-fade3{animation:tqpxChip .4s ease forwards 1.9s,tqpxDim .6s ease forwards 2.6s}
.tqpx.tqz-visible .tqpx-res{animation:tqpxFade .6s ease forwards 2.9s}
.tqpx.tqz-visible .tqpx-gauge i{animation:tqpxGauge 1.4s cubic-bezier(.25,.6,.3,1) forwards 1.5s}
.tqpx.tqz-visible .tqpx-lvl{animation:tqpxPop .5s cubic-bezier(.34,1.56,.64,1) forwards 2.7s}
.tqpx.tqz-visible .tqpx-m1 i{animation:tqpxB1 1s cubic-bezier(.25,.6,.3,1) forwards 2s}
.tqpx.tqz-visible .tqpx-m2 i{animation:tqpxB2 1s cubic-bezier(.25,.6,.3,1) forwards 2.25s}
.tqpx.tqz-visible .tqpx-foot{animation:tqpxUp .6s ease forwards 3.4s}
@keyframes tqpxUp{to{opacity:1;transform:translateY(0)}}
@keyframes tqpxChip{to{opacity:1;transform:translateX(0)}}
@keyframes tqpxPop{to{opacity:1;transform:scale(1)}}
@keyframes tqpxFade{to{opacity:1}}
@keyframes tqpxDim{to{opacity:.4}}
@keyframes tqpxGauge{to{width:68%}}
@keyframes tqpxB1{to{width:50%}}
@keyframes tqpxB2{to{width:80%}}
@keyframes tqpxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tqpxFloatAlt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:500px){
.tqpx{padding:20px 6px}
.tqpx-row{flex-direction:column;gap:12px}
.tqpx-card{padding:18px 16px 16px}
.tqpx-score b{font-size:34px}
.tqpx-ou{position:static;order:1;align-self:center;transform:scale(.6);margin:-2px 0}
.tqpx-card.pro{order:0}
.tqpx-card.sco{order:2}
}
</style>
<div class="tqpx" id="tqpx-widget">
<div class="tqpx-row">
<div class="tqpx-card pro">
<div class="tqpx-h">Quiz par profil</div>
<div><span class="tqpx-ban">Révèle QUI ils sont</span></div>
<div class="tqpx-p tqpx-p1 win"><span class="em">🎯</span>Stratège<span class="tqpx-ok">✓</span></div>
<div class="tqpx-p tqpx-p2 tqpx-fade2"><span class="em">🎨</span>Créatif</div>
<div class="tqpx-p tqpx-p3 tqpx-fade3"><span class="em">🚀</span>Fonceur</div>
<div class="tqpx-res">Profil : <b>Stratège</b> → segmente &amp; personnalise</div>
</div>
<div class="tqpx-ou">OU</div>
<div class="tqpx-card sco">
<div class="tqpx-h">Quiz scoré</div>
<div><span class="tqpx-ban">Mesure OÙ ils en sont</span></div>
<div class="tqpx-score"><b>68</b><span>/100</span></div>
<div class="tqpx-gauge"><i></i></div>
<div><span class="tqpx-lvl">Niveau : en bonne voie</span></div>
<div class="tqpx-mini tqpx-m1"><label><span>Sommeil</span><span>50</span></label><div class="bar"><i></i></div></div>
<div class="tqpx-mini tqpx-m2"><label><span>Émotions</span><span>80</span></label><div class="bar"><i></i></div></div>
</div>
</div>
<div class="tqpx-foot"><span>Dans les deux cas : <b>+1 tag Systeme.io</b> selon le résultat ✓</span></div>
</div>
