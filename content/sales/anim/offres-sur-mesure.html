/* ── ANIMATIONS AU SCROLL ── */

.tqz1-poll.tqz1-visible .tqz1-s2{animation:tqz1SIn .6s ease forwards .7s,tqz1Pulse 4s ease-in-out 2.7s infinite}

@keyframes tqz1SIn{to{opacity:1}}
@keyframes tqz1Line{to{stroke-dashoffset:0}}
@keyframes tqz1Pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.07)}}
@keyframes tqz1FloatLbl{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}

<!-- Scroll reveal compatible Systeme.io (scroll + polling fallback) -->
<script>
(function(){
  var done=false;
  function check(){
    var el=document.getElementById('tqz1-poll-widget');
    if(!el||done)return;
    var rect=el.getBoundingClientRect();
    var winH=window.innerHeight||document.documentElement.clientHeight;
    if(rect.top<winH*0.85){
      el.classList.add('tqz1-visible');
      done=true;
      window.removeEventListener('scroll',check);
      window.removeEventListener('resize',check);
    }
  }
  window.addEventListener('scroll',check,{passive:true});
  window.addEventListener('resize',check,{passive:true});
  var polls=0;
  var poller=setInterval(function(){
    check();
    polls++;
    if(done||polls>33)clearInterval(poller);
  },300);
  check();
})();
</script></div>
