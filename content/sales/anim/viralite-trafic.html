<div id="rawhtml-4d9241b5" class="sc-evdWiR hOAxvc"><!-- TIQUIZ — Dashboard animé — Coller dans un bloc HTML Systeme.io -->
<style>
.tqz1-wrap *{margin:0;padding:0;box-sizing:border-box}
.tqz1-wrap{width:100%;max-width:460px;margin:0 auto;padding:30px 16px;position:relative;font-family:'Inter','Open Sans',sans-serif}
.tqz1-main{position:relative;background:linear-gradient(160deg,#f0f2fb 0%,#e4e7f5 100%);border-radius:22px;box-shadow:0 12px 40px rgba(43,50,100,0.1);overflow:visible;height:320px}
.tqz1-inner{position:absolute;inset:8px;background:#fff;border-radius:16px;overflow:hidden}
.tqz1-chart{position:absolute;bottom:0;left:0;right:0;top:0}
.tqz1-chart svg{width:100%;height:100%;display:block}
/* Masqués par défaut */
.tqz1-chart-path{fill:none;stroke:#20BBE6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700}
.tqz1-chart-area{fill:url(#tqz1G);opacity:0}
.tqz1-pct{position:absolute;top:50%;right:80px;background:#5E6DDE;color:#fff;font-size:0.95rem;font-weight:800;padding:7px 16px;border-radius:50px;opacity:0;transform:scale(0.5)}
.tqz1-card{position:absolute;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(43,50,100,0.12);opacity:0}
.tqz1-card-visits{left:-20px;bottom:50px;padding:18px 22px;transform:translateX(-40px)}
.tqz1-card-leads{right:-16px;top:-20px;padding:16px 20px;transform:translateX(40px)}
.tqz1-lbl{font-size:0.72rem;font-weight:700;color:#20BBE6;display:flex;align-items:center;gap:6px;margin-bottom:6px;letter-spacing:0.02em}
.tqz1-lbl svg{width:16px;height:16px;fill:none;stroke:#20BBE6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tqz1-val{font-size:2rem;font-weight:800;color:#2B3264;line-height:1;letter-spacing:-0.03em}
/* ── ANIMATIONS AU SCROLL ── */
.tqz1-wrap.tqz1-visible .tqz1-chart-path{animation:tqz1Draw 3s ease forwards 0.6s}
.tqz1-wrap.tqz1-visible .tqz1-chart-area{animation:tqz1Area 1.5s ease forwards 2.2s}
.tqz1-wrap.tqz1-visible .tqz1-pct{animation:tqz1Pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards 3s}
.tqz1-wrap.tqz1-visible .tqz1-card-visits{animation:tqz1FromLeft 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards 1s,tqz1Float 4s ease-in-out 1.7s infinite}
.tqz1-wrap.tqz1-visible .tqz1-card-leads{animation:tqz1FromRight 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards 1.6s,tqz1FloatAlt 5s ease-in-out 2.3s infinite}
@keyframes tqz1Draw{to{stroke-dashoffset:0}}
@keyframes tqz1Area{to{opacity:0.3}}
@keyframes tqz1Pop{to{opacity:1;transform:scale(1)}}
@keyframes tqz1FromLeft{to{opacity:1;transform:translateX(0) translateY(0)}}
@keyframes tqz1FromRight{to{opacity:1;transform:translateX(0) translateY(0)}}
@keyframes tqz1Float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tqz1FloatAlt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:500px){
.tqz1-wrap{max-width:100%;padding:20px 10px}
.tqz1-main{height:270px}
.tqz1-val{font-size:1.5rem}
.tqz1-card-visits{left:-6px;bottom:40px;padding:14px 16px}
.tqz1-card-leads{right:-6px;top:-10px;padding:12px 16px}
.tqz1-pct{right:40px;font-size:0.82rem;padding:5px 12px}
}
</style>

<!-- Scroll reveal compatible Systeme.io (scroll + polling fallback) -->
<script>
(function(){
  var done=false;
  function check(){
    var el=document.getElementById('tqz1-dash-widget');
    if(!el||done)return;
    var rect=el.getBoundingClientRect();
    var winH=window.innerHeight||document.documentElement.clientHeight;
    if(rect.top<winH*0.85){
      el.classList.add('tqz1-visible');
      done=true;
      window.removeEventListener('scroll',check);
      window.removeEventListener('resize',check);
    }
  }
  window.addEventListener('scroll',check,{passive:true});
  window.addEventListener('resize',check,{passive:true});
  var polls=0;
  var poller=setInterval(function(){
    check();
    polls++;
    if(done||polls>33)clearInterval(poller);
  },300);
  check();
})();
</script></div>
